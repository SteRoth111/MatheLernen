<script>
'use strict';
// Neue Inseln und Aufgaben werden hier ergänzt. Keine Anmeldung, keine externen Dienste.
const ISLANDS=[
 {id:'preschool',grade:'Vorschule',name:'Drachenwiese',color:'#88b871',accent:'#f2cf72',dragon:'Moos',title:'Das verschwundene Glühwürmchen',range:10,tag:'Mengen & Rechnen bis 10',story:'Auf der Drachenwiese wird es Abend. Moos sucht Glimmi, das kleine Glühwürmchen. Fünf leuchtende Blumen zeigen euch den Weg. Zähle und rechne mit Moos – zusammen bringt ihr Glimmi nach Hause.',reward:'Wiesendrache Moos',after:'Glimmi ist wieder zu Hause! Moos tanzt zwischen den leuchtenden Blumen. Ab jetzt begleitet er dich in deiner Drachensammlung.',tasks:[[2,1,'+'],[4,2,'−'],[3,2,'+'],[5,1,'−'],[4,3,'+'],[6,3,'−'],[5,3,'+'],[8,4,'−'],[6,4,'+'],[10,5,'−']]},
 {id:'grade1',grade:'1. Klasse',name:'Funkelwald',color:'#62ac98',accent:'#e6bc70',dragon:'Fino',title:'Bring das Drachenlicht zurück',range:20,tag:'Plus & Minus bis 20',story:'Im Funkelwald sind die Laternen dunkel geworden. Fino hat eine Idee: In jeder Laterne steckt ein kleiner Rechenzauber. Hilf ihm, fünf Lichtfunken zu finden. Du darfst ausprobieren, Hilfe holen und deinen eigenen Weg entdecken.',reward:'Walddrache Fino',after:'Alle fünf Laternen leuchten. Fino breitet seine Flügel aus – der Funkelwald hat sein Licht zurück!',tasks:[[4,3,'+'],[9,4,'−'],[8,5,'+'],[12,3,'−'],[7,6,'+'],[15,7,'−'],[9,8,'+'],[17,9,'−'],[12,6,'+'],[20,6,'−']]},
 {id:'grade2',grade:'2. Klasse',name:'Kristallbucht',color:'#70b6d1',accent:'#cab5ed',dragon:'Kira',title:'Die Brücke aus Kristallen',range:100,tag:'Zahlen entdecken · Rechnen bis 20 und 30',story:'Kira möchte zur kleinen Insel in der Kristallbucht fliegen. Doch der Wind ist zu stark. Gemeinsam baut ihr eine Brücke aus fünf funkelnden Kristallen. Jede Rechenaufgabe bringt euch einen Kristall näher ans andere Ufer.',reward:'Kristalldrache Kira',after:'Die Kristallbrücke funkelt über dem Wasser. Kira erreicht die kleine Insel und bedankt sich mit einem fröhlichen Flügelschlag.',tasks:[[23,14,'+'],[48,21,'−'],[36,7,'+'],[52,8,'−'],[28,35,'+'],[71,26,'−'],[47,18,'+'],[90,47,'−'],[56,29,'+'],[100,38,'−']]},
 {id:'grade3',grade:'3. Klasse',name:'Wolkenberge',color:'#aa9cdb',accent:'#c7dae9',dragon:'Lumo',title:'Die verlorenen Wolkensterne',range:1000,tag:'Wiederholen & entdecken · Zahlen bis 100',story:'Hoch über den Wolken hat Lumo seine Sternenkarte verloren. Ihre fünf Sterne schweben zwischen den Bergen. Mit Hundertern, Zehnern und Einern findest du den Weg. Lumo wartet auf dich – ohne Eile.',reward:'Wolkendrache Lumo',after:'Die Sternenkarte ist wieder vollständig. Lumo malt mit seiner Flugspur einen leuchtenden Bogen an den Himmel.',tasks:[[230,140,'+'],[480,210,'−'],[365,27,'+'],[502,80,'−'],[278,135,'+'],[710,260,'−'],[456,187,'+'],[900,475,'−'],[568,229,'+'],[1000,386,'−']]},
 {id:'grade4',grade:'4. Klasse',name:'Feuerfels',color:'#d88f76',accent:'#f5bd64',dragon:'Ember',title:'Das Herz des Feuerbergs',range:1000,tag:'Knobelaufgaben bis 1.000',story:'Ember hört ein leises Klopfen im Feuerberg. Das freundliche Drachenherz braucht fünf Wärmekristalle. Manche Rechenzauber verstecken eine Zahl, andere erzählen eine Geschichte. Schau genau hin und probiere einen Rechenweg.',reward:'Feuerdrache Ember',after:'Das Drachenherz glüht wieder warm. Ember führt einen kleinen Freudentanz auf. Der Feuerberg ist wieder ein gemütliches Zuhause.',tasks:[[375,248,'+'],[804,367,'−'],[286,157,'+','missing'],[900,456,'−','missing'],[468,275,'+','story'],[720,285,'−','story'],[597,186,'+'],[1000,647,'−'],[358,267,'+','missing'],[832,458,'−','story']]}
];
// INSELSTRUKTUR: Orte und Drachenmissionen lassen sich hier unabhängig vom Spielstand ändern.
// Die Nummern in „levels“ sind dauerhafte Inhalts-IDs. Beim Umgruppieren erhalten lassen.
const ISLAND_LAYOUT={
 preschool:[['meadow','Glühwiese'],['pond','Seerosenteich'],['tree','Alter Drachenbaum'],['cave','Mooshöhle'],['crystal','Funkelfelsen']],
 grade1:[['tree','Laternenbaum'],['meadow','Funkellichtung'],['cave','Mooshöhle'],['pond','Glitzerteich'],['crystal','Kristalllichtung']],
 grade2:[['beach','Kristallstrand'],['palm','Palmenoase'],['crystal','Kristallgrotte'],['cave','Muschelhöhle'],['pond','Lagune']],
 grade3:[['peak','Sternengipfel'],['cloud','Wolkentor'],['cave','Himmelsgrotte'],['crystal','Mondkristalle'],['meadow','Sonnenwiese']],
 grade4:[['volcano','Herzvulkan'],['cave','Gluthöhle'],['crystal','Feuerkristalle'],['pond','Warme Quellen'],['peak','Aschegipfel']]
};
for(const [id,places] of Object.entries(ISLAND_LAYOUT))ISLAND_LAYOUT[id]=places.map(([landmark,name],n)=>({id:'place-'+(n+1),name,landmark,levels:Array.from({length:4},(_,k)=>n*4+k+1),position:[[20,80],[50,65],[77,48],[52,32],[23,15]][n]}));
// Die neue Lernreise für Klasse 2 hat 20 eigene Inhalts-IDs; ID 1 bleibt als gespeicherter Bonus bestehen.
ISLAND_LAYOUT.grade2.forEach((place,n)=>place.levels=Array.from({length:4},(_,k)=>21+n*4+k));
function validateLayout(){for(const i of ISLANDS){const places=ISLAND_LAYOUT[i.id],numbers=new Set(),ids=new Set(),names=new Set();if(!places?.length)throw Error('Inselorte fehlen.');for(const p of places){if(ids.has(p.id)||names.has(p.name)||!p.levels.length||!Array.isArray(p.position)||p.position.length!==2)throw Error('Inselorte brauchen eindeutige Namen und Positionen.');ids.add(p.id);names.add(p.name);for(const n of p.levels){if(!Number.isInteger(n)||n<1||numbers.has(n))throw Error('Drachenmissionen brauchen eindeutige Inhaltsnummern.');numbers.add(n);}}}}
validateLayout();
function locationForLevel(id,number){return ISLAND_LAYOUT[id]?.find(p=>p.levels.includes(number))||(['grade2','grade3'].includes(id)&&number===1?ISLAND_LAYOUT[id][0]:null);}
function decorateLevel(level){const places=ISLAND_LAYOUT[level.islandId],location=locationForLevel(level.islandId,level.number);if(!location)throw Error('Der Drachenmission fehlt die Zuordnung zu einem Inselort.');const placeIndex=places.indexOf(location)+1,subIndex=location.levels.indexOf(level.number)+1;return {...level,location,place:location.name,landmark:location.landmark,placeIndex,subIndex,label:level.legacy?'Bonus':`${placeIndex}.${subIndex}`};}

// LEVELSYSTEM: feste Nummern erhalten Spielstände und Trophäen beim Ergänzen.
const LEVEL_CONTENT=new Map();
function levelKey(islandId,number=1){return number===1?islandId:`${islandId}.level-${number}`;}
function registerLevel(config){
 const island=ISLANDS.find(i=>i.id===config.island);
 if(!island||!Number.isInteger(config.number)||config.number<1||config.number>100||!locationForLevel(config.island,config.number))throw Error('Insel oder Levelnummer ungültig.');
 const key=levelKey(config.island,config.number);if(LEVEL_CONTENT.has(key))throw Error('Diese Levelnummer ist bereits vergeben: '+key);
 if(!Number.isInteger(config.range)||config.range<1||config.range>1000||!config.title||!config.story||!config.trophy?.name||!['dragon','crystal','lantern','egg','medal'].includes(config.trophy.type))throw Error('Levelinhalt unvollständig.');
 if(!Array.isArray(config.tasks)||![5,10].includes(config.tasks.length))throw Error('Ein Aufgabenvorrat braucht fünf oder zehn Aufgaben.');
 for(const t of config.tasks){
  if(Array.isArray(t)){if(!Number.isInteger(t[0])||!Number.isInteger(t[1])||!['+','−','·',':'].includes(t[2])||(['·',':'].includes(t[2])&&t[3]!==undefined)||(t[2]===':'&&(t[1]===0||t[0]%t[1]!==0))||![undefined,'missing','story'].includes(t[3])||t[0]<0||t[1]<0||taskResult(t)<0||taskResult(t)>config.range||Math.max(t[0],t[1])>config.range)throw Error('Aufgaben außerhalb des Zahlenraums.');if(t[3]==='story'&&config.island!=='grade4'&&(typeof t[4]!=='string'||!t[4].trim()))throw Error('Eine Sachaufgabe braucht einen Aufgabentext.');}
  else if(!validateObjectTask(t,config.range))throw Error('Zahlenaufgabe ungültig.');
 }
 LEVEL_CONTENT.set(key,{...config,islandId:config.island,available:true,key});
}
// Die fünf bestehenden Einstiegslevel bleiben mit ihren alten Spielständen kompatibel.
for(const i of ISLANDS)registerLevel({island:i.id,number:1,legacy:['grade2','grade3'].includes(i.id),title:i.title,story:i.story,after:i.after,range:i.range,tasks:i.tasks,place:{preschool:'Glühwiese',grade1:'Laternenbaum',grade2:'Kristallstrand',grade3:'Sternengipfel',grade4:'Herzvulkan'}[i.id],landmark:{preschool:'meadow',grade1:'tree',grade2:'beach',grade3:'peak',grade4:'volcano'}[i.id],trophy:{type:'dragon',name:i.dragon+'s Drachenfigur'}});
// ===== NEUE LEVEL HIER EINFÜGEN =====
// Künftige Ergänzungen bestehen aus einem registerLevel({...})-Block.
// Ein Block enthält Insel, dauerhafte Inhaltsnummer, Lernziel, Story, Trophäe und 5 oder 10 Aufgaben im Vorrat. Pro neuer Runde werden 5 gespielt.
// Die Zuordnung zum Ort erfolgt über ISLAND_LAYOUT; Nummern bleiben bei Umgruppierung erhalten.
// Existierende Nummern und Aufgaben unverändert lassen; neue Inhalte neu nummerieren.
// Klasse 2: 20 Drachenmissionen, je zehn Aufgaben. Zahlenfreunde ergänzen auf 10.
// Inhaltsnummern 21–40 erhalten die bisherigen Spielstände der Bonusmission (ID 1).
const GRADE2_MISSIONS=[
 {title:'Die Paar-Muscheln',goal:'Gerade und ungerade Zahlen bis 10 unterscheiden',range:10,type:'parity',numbers:[2,5,8,3,10,7,4,1,6,9],story:'Am Kristallstrand ordnet Kira Muscheln in Zweierpaare. Manchmal bleibt eine Muschel allein. Entdecke mit ihr gerade und ungerade Zahlen.',prize:'Kiras Paar-Muschel',trophy:'medal'},

function diceWays(sum){let count=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a+b===sum)count++;return count;}
function statementTruth(t){return t.mode===0?t.values[t.a]>t.values[t.b]:t.mode===1?t.values[t.a]===Math.max(...t.values):t.mode===2?t.values[t.a]<t.values[t.b]:t.values[t.a]===t.claimed;}
function clockText(minutes){return String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');}
function euroText(cents){return Math.floor(cents/100)+' € '+String(cents%100).padStart(2,'0')+' ct';}
function taskLimit(t){return t.type==='money'&&!t.whole?10000:t.type==='clock'?1439:1000;}
function numericTaskAnswer(t){
 switch(t.type){
  case 'parity':return t.number%2;
  case 'bond':return t.total-t.number;
  case 'neighbor':return t.number+(t.direction==='previous'?-1:1);
  case 'hundredCount':case 'rods':case 'numberLine':return t.number;
  case 'hundredNeighbor':return t.number+({up:-10,right:1,down:10,left:-1})[t.direction];
  case 'array':return t.mode==='equations'?t.correct:t.rows*t.cols;
  case 'money':return t[t.ask]/(t.whole?100:1);
  case 'clock':return t.hour*60+t.minute;
  case 'elapsed':return t.end-t.start;
  case 'lengthUnits':return t.cm;
  case 'lengthCompare':return t.base+t.delta;
  case 'chart':return t.values[t.target];
  case 'chartStatement':return statementTruth(t)?0:1;
  case 'dicePair':return t.sum-t.first;
  case 'diceCount':return diceWays(t.sum);
  case 'diceChance':return diceWays(t.a)>diceWays(t.b)?0:1;
  case 'solid':return t.shape;
  case 'view':return t.direction;
  case 'pattern':return t.pattern[0];
  default:return NaN;
 }
}
function validateObjectTask(t,range){
 if(!t||typeof t!=='object'||Array.isArray(t))return false;
 const whole=(v,min,max)=>Number.isInteger(v)&&v>=min&&v<=max;
 let valid=false;
 switch(t.type){
  case 'parity':valid=whole(t.number,0,range);break;
  case 'bond':valid=whole(t.total,1,range)&&whole(t.number,0,t.total);break;
  case 'neighbor':valid=whole(t.number,0,range)&&['previous','next'].includes(t.direction);break;
  case 'hundredCount':case 'rods':case 'numberLine':valid=whole(t.number,0,100);break;
  case 'hundredNeighbor':valid=whole(t.number,1,100)&&['up','right','down','left'].includes(t.direction)&&whole(numericTaskAnswer(t),1,100)&&!(t.direction==='right'&&t.number%10===0)&&!(t.direction==='left'&&t.number%10===1);break;
  case 'array':valid=whole(t.rows,1,10)&&whole(t.cols,1,10)&&['equations','count'].includes(t.mode)&&(t.mode==='count'||whole(t.correct,0,3));break;
  case 'money':valid=['price','paid','change'].includes(t.ask)&&[t.price,t.paid,t.change].every(v=>whole(v,0,10000))&&t.paid-t.price===t.change&&typeof t.whole==='boolean'&&(!t.whole||[t.price,t.paid,t.change].every(v=>v%100===0));break;
  case 'clock':valid=whole(t.hour,0,23)&&whole(t.minute,0,59);break;
  case 'elapsed':valid=whole(t.start,0,1439)&&whole(t.end,t.start+1,1439)&&t.end-t.start<=1000;break;
  case 'lengthUnits':valid=whole(t.cm,0,1000)&&['toCm','toParts'].includes(t.mode);break;
  case 'lengthCompare':valid=whole(t.base,0,1000)&&Number.isInteger(t.delta)&&Math.abs(t.delta)<=1000;break;
  case 'chart':case 'chartStatement':valid=Array.isArray(t.values)&&t.values.length===5&&t.values.every(v=>whole(v,0,50))&&(t.type==='chart'?whole(t.target,0,4):whole(t.mode,0,3)&&whole(t.a,0,4)&&whole(t.b,0,4)&&whole(t.claimed,0,50));break;
  case 'dicePair':valid=whole(t.sum,2,12)&&whole(t.first,1,6)&&whole(t.sum-t.first,1,6);break;
  case 'diceCount':valid=whole(t.sum,2,12);break;
  case 'diceChance':valid=whole(t.a,2,12)&&whole(t.b,2,12)&&diceWays(t.a)!==diceWays(t.b);break;
  case 'solid':valid=whole(t.shape,0,2)&&whole(t.variant,0,2);break;
  case 'view':valid=whole(t.direction,0,3);break;
  case 'pattern':valid=Array.isArray(t.pattern)&&t.pattern.length>=2&&t.pattern.length<=4&&t.pattern.every(v=>whole(v,0,3))&&new Set(t.pattern).size===t.pattern.length;break;
 }
 const answer=numericTaskAnswer(t);
 return valid&&Number.isInteger(answer)&&answer>=0&&answer<=taskLimit(t)&&(!['neighbor','parity','bond'].includes(t.type)||answer<=range);
}

 return null;

function submitTaskAnswer(){const t=currentTask();let ids,scales;
 if(t.type==='clock'){ids=['answerHours','answerMinutes'];scales=[60,1];}
 else if(t.type==='money'&&!t.whole){ids=['answerEuros','answerCents'];scales=[100,1];}
 else if(t.type==='lengthUnits'&&t.mode==='toParts'){ids=['answerMeters','answerCentimeters'];scales=[100,1];}
 else {const value=$('#answer').value;if(value.trim()==='')return;checkAnswer(Number(value));return;}
 const values=ids.map(id=>$('#'+id).value);if(values.some(v=>v.trim()===''))return;
 const numbers=values.map(Number),limits=t.type==='clock'?[23,59]:t.type==='money'?[100,99]:[10,99];

}

function allLevels(){return ISLANDS.flatMap(i=>[...islandLevels(i.id),...(savedBonus(i.id)?[savedBonus(i.id)]:[])]);}
function completedLevels(){return allLevels().filter(l=>progress(l.islandId,l.number).completed);}
function islandCompleted(id){const levels=islandLevels(id).filter(l=>l.available);return levels.length>0&&levels.every(l=>progress(id,l.number).completed);}
function progress(id,number=1){return profile()?.progress[levelKey(id,number)]||{completed:false,history:[],run:null};}
function ensureProgress(id,number=1){const p=profile();if(!p)return null;const key=levelKey(id,number);return p.progress[key]||(p.progress[key]={completed:false,history:[],run:null,rounds:0,best:null,sparks:0});}
function gameProgress(){return ensureProgress(currentIsland.id,currentLevel.number);}
function startGame(id,number=1){const level=getLevel(id,number);if(!level.available){toast('Die Lerninhalte für dieses Level kommen später.');return;}if(!profile()){selected=id;openProfiles();toast('Wähle zuerst einen Spitznamen.');return;}currentIsland=ISLANDS.find(i=>i.id===id);currentLevel=level;selectedPlace=level.location.id;const pr=gameProgress();if(!pr.run){pr.run=newRun();save();renderGameStory();}else renderTask();if(!$('#gameDialog').open)$('#gameDialog').showModal();}
function hintText(t){if(!Array.isArray(t)){if(!['parity','bond','neighbor'].includes(t.type))return extraTaskHint(t);if(t.type==='parity')return 'Lege die Menge mit Punkten oder Plättchen nach und bilde immer Zweierpaare. Bleibt eines allein, ist die Zahl ungerade. Ohne Rest ist sie gerade. ';if(t.type==='neighbor')return t.direction==='previous'?'Suche die Zahl auf einer Zahlenspur. Gehe genau einen Schritt zurück. Welche Zahl steht direkt davor?':'Suche die Zahl auf einer Zahlenspur. Gehe genau einen Schritt weiter. Welche Zahl steht direkt danach?';return `Lege ${t.number} Plättchen in ein Zehnerfeld. Wie viele Plätze sind noch frei? Ergänze die leeren Plätze oder rechne ${t.total} − ${t.number} = ?.`;}if(typeof t[5]==='string')return esc(t[5]);if(t[2]==='·')return 'Lege gleich große Gruppen oder ein Punktefeld. Du kannst eine bekannte Kernaufgabe nutzen und eine Gruppe ergänzen oder wegnehmen. Rechne die Teilergebnisse selbst aus.';if(t[2]===':')return `Nutze die Umkehraufgabe: ${t[1]} · ? = ${t[0]}. Oder verteile die Menge in gleich große Gruppen und zähle selbst, wie viele Gruppen entstehen.`;const a=t[0],b=t[1],result=taskResult(t);if(t[3]==='missing')return t[2]==='+'?`Nutze die Umkehraufgabe: ${result} − ${a} = ?. Ziehe zuerst Hunderter, dann Zehner und Einer ab. `:`Nutze die Umkehraufgabe: ${a} − ${result} = ?. Oder ergänze von ${result} bis ${a}. Wie groß ist der Unterschied?`;if(currentLevel.range===10)return t[2]==='+'?`Starte mit ${a} Punkten. Lege ${b} dazu. Zähle selbst, wie viele es zusammen sind.`:`Starte mit ${a} Punkten und nimm ${b} weg. Zähle selbst, wie viele bleiben.`;if(currentLevel.range<=30){const crosses=Math.floor(a/10)!==Math.floor(result/10)&&a%10!==0;const path=t[2]==='+'?crosses?`Starte bei ${a} und ergänze ${b}. Du kannst zuerst bis zum nächsten Zehner gehen. Zerlege dafür die zweite Zahl und rechne den Rest danach weiter.`:`Starte bei ${a} und ergänze ${b} schrittweise. Rechne ganze Zehner und Einer nacheinander oder gehe auf einer Zahlenspur vorwärts.`:crosses?`Starte bei ${a} und ziehe ${b} ab. Du kannst die zweite Zahl zerlegen und beim Zurückgehen am Zehner Halt machen.`:`Starte bei ${a} und ziehe ${b} ab. Rechne ganze Zehner und Einer nacheinander oder gehe auf einer Zahlenspur rückwärts.`;return (t[3]==='story'?'Lege die Geschichte mit Punkten nach. ':'')+path+'';}const parts=[Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(Boolean);const stages=parts.map((part,n)=>`${n?'dein Zwischenergebnis':a} ${t[2]} ${part} = ?`);return `Zerlege ${b} in ${parts.join(' + ')}. ${stages.join(' → ')}.`;}

function renderParents(){const p=profile(),levels=installedLevels();const rows=levels.map(l=>({l,i:ISLANDS.find(x=>x.id===l.islandId),pr:progress(l.islandId,l.number)}));const all=rows.flatMap(x=>x.pr.history),last=all.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">Lernen begleiten</div><h1>Kleine Schritte sichtbar machen.</h1><p>Hier sehen Sie die Fortschritte von ${p?esc(p.name):'Ihrem Kind'}. Die Übersicht gehört ausschließlich zu diesem Browser.</p></div><button class="btn secondary" data-action="profiles">Kind wechseln</button></section><div class="parent-grid"><section class="panel"><h3>${p?'Lernreise von '+esc(p.name):'Noch kein Kinderprofil'}</h3><div class="stats"><div class="stat"><strong>${completedLevels().length}/${levels.length}</strong><span>Verfügbare Drachenmissionen geschafft</span></div><div class="stat"><strong>${totalRounds()}</strong><span>Runden abgeschlossen</span></div><div class="stat"><strong>${last?firstTry(last.records)+'/'+last.records.length:'–'}</strong><span>Zuletzt im ersten Versuch ohne Hilfe</span></div></div><p class="small muted">Die Lernabenteuer sind nach Inselorten und Drachenmissionen gegliedert. Die konkreten Lerninhalte werden einzeln ergänzt. Wiederholte Aufgaben allein belegen noch keine sichere Beherrschung.</p></section><section class="panel"><h3>Spielstände aufbewahren</h3><p class="small muted">Spielstände liegen auf diesem Gerät in diesem Browser und werden nicht automatisch übertragen. Wer denselben Browser verwendet, kann diese Profile sehen.</p><div class="tools"><button class="btn" data-action="export">Sicherung herunterladen</button><button class="btn light" data-action="import">Sicherung laden</button></div><p class="small muted" style="margin-top:16px">Beim Laden werden die vorhandenen Profile nach Bestätigung ersetzt. Alte Sicherungen bleiben kompatibel. Enthält eine Sicherung neuere Level, muss zuerst die passende Websiteversion geöffnet werden.</p></section></div><section class="panel" style="margin-top:22px"><h3 style="margin-bottom:15px">Fortschritt pro Drachenmission</h3><div class="table-wrap"><table><thead><tr><th>Insel & Mission</th><th>Stand</th><th>Beste Übungsrunde</th><th>Erster Versuch ohne Hilfe</th><th>Mit Tipp / weiterem Versuch</th><th>Gemeinsam gelöst</th></tr></thead><tbody>${rows.map(({l,i,pr})=>{const h=pr.history.at(-1),r=pr.run?.records||h?.records;return `<tr><td><strong>${i.name} · Drachenmission ${getLevel(i.id,l.number).label}</strong><br><span class="muted">${esc(l.learningGoal||l.title)}</span></td><td>${pr.run?'In Arbeit: '+pr.run.idx+'/'+runTotal(pr.run):h?'Abgeschlossen':'Noch nicht besucht'}</td><td>${bestSummary(i.id,l.number)||'Noch keine Runde'}</td><td>${r?firstTry(r):'–'}</td><td>${r?r.filter(x=>!x.guided&&(x.hint||x.attempts>1)).length:'–'}</td><td>${r?r.filter(x=>x.guided).length:'–'}</td></tr>`;}).join('')}</tbody></table></div><p class="small muted" style="margin-top:15px">Die beste Runde bleibt dauerhaft erhalten: zuerst zählt der Anteil selbst gelöster Aufgaben, dann der Anteil der Treffer im ersten Versuch. Strategie-Tipps sind erlaubt. Die übrigen Spalten zeigen die laufende oder letzte Runde. Funken und Wachstum beschreiben Übung, keine feste Begabung oder sichere Beherrschung.</p></section><section class="panel" style="margin-top:22px"><h3>Ein Blick auf den Lernweg</h3><p class="small muted" style="margin-top:12px">${last?.reflection?esc(REFLECTION_CHOICES[last.reflection]):'Nach einem Abenteuer kann Ihr Kind freiwillig erzählen, welche Strategie oder Hilfe nützlich war.'}</p><p class="small muted" style="margin-top:10px">Keine Geschwindigkeitswertung, keine Rangliste und keine Extra-Funken für perfekte Durchgänge. Auch nach 200 gespeicherten Runden bleiben Gesamtfunken, Übungszähler und bester Durchgang erhalten.</p></section><div class="hall-note">🌱 Fragen Sie nach dem Rechenweg: „Wie bist du auf dein Ergebnis gekommen?“ Üben Sie danach ähnliche Aufgaben mit neuen Zahlen. Hilfe und Pausen sind Teil des Lernens.</div>`;}

function getLevel(id,number=1){const existing=LEVEL_CONTENT.get(levelKey(id,number));if(existing)return decorateLevel(existing);return decorateLevel({islandId:id,number,key:levelKey(id,number),available:false,title:'Dein nächstes Abenteuer',trophy:{type:['dragon','crystal','lantern','egg','medal'][(number-1)%5],name:'Trophäe für Drachenmission '+number}});}
function islandLevels(id){return ISLAND_LAYOUT[id].flatMap(p=>p.levels.map(n=>getLevel(id,n)));}
function placeProgress(id,place){const levels=place.levels.map(n=>getLevel(id,n));return {total:levels.length,completed:levels.filter(l=>progress(id,l.number).completed).length,available:levels.filter(l=>l.available).length};}
function flightRoute(i){const points=ISLAND_LAYOUT[i.id].map(p=>[p.position[0]*8,p.position[1]*5.3-17]);let path=`M${points[0][0]} ${points[0][1]}`;const sparks=[];for(let n=1;n<points.length;n++){const [x,y]=points[n-1],[a,b]=points[n],c=x+(a-x)*.6,d=b+(y-b)*.4;path+=`C${c} ${y} ${a} ${d} ${a} ${b}`;sparks.push([x*.125+c*.375+a*.5,y*.5+d*.375+b*.125]);}return {path,sparks};}
function bonusPanel(id,hall=false){const l=savedBonus(id);if(!l)return '';const pr=progress(id,l.number),i=ISLANDS.find(x=>x.id===id);return `<section class="panel saved-bonus"><span class="eyebrow">Dein bisheriges Abenteuer</span><h3>${esc(l.title)}</h3><p class="small muted">Bonusmission bis ${l.range} · Dein gespeicherter Lernweg und deine Trophäe bleiben erhalten.</p>${hall&&pr.completed?`<div class="bonus-art">${trophyArt(l,i)}</div><strong>${esc(l.trophy.name)}</strong>`:''}${bestSummary(id,l.number)}<button class="btn light" data-action="play" data-id="${id}" data-number="${l.number}">${pr.run?'Gespeicherte Reise fortsetzen':'Bonusmission noch einmal üben'} →</button></section>`;}
function renderTrophies(){const earned=completedLevels(),island=ISLANDS.find(i=>i.id===hallIsland),places=island?ISLAND_LAYOUT[island.id]:[],items=allLevels().filter(l=>(hallIsland==='all'||l.islandId===hallIsland)&&(hallPlace==='all'||l.location.id===hallPlace)&&(hallMode==='all'||progress(l.islandId,l.number).completed));$('#app').innerHTML=`<section class="collection-hero"><div><span class="eyebrow">Deine Schätze</span><h1>${currentWorld().id==='dragon'?'Drachenhalle':'Sammlung'}</h1><div class="collection-totals"><span>🏆 <strong>${earned.length}</strong></span><span>${tokenIcon()} <strong>${sparkTotal()}</strong> ${currentWorld().token}</span></div></div><button class="companion-mini" data-action="growth" aria-label="Deinen Begleiter ansehen">${grownDragon((island||ISLANDS[1]).color)}</button></section><div class="hall-toolbar"><div class="segmented" aria-label="Sammlung filtern">${[['earned','Gesammelt'],['all','Alle Preise']].map(([id,label])=>`<button data-action="hall-mode" data-id="${id}" class="${hallMode===id?'active':''}" aria-pressed="${hallMode===id}">${label}</button>`).join('')}</div><label class="motion-toggle"><input type="checkbox" id="calmToggle" ${state.calm?'checked':''}> Ruhige Ansicht</label></div><div class="chapter-tabs" aria-label="Trophäen nach Klasse"><button data-action="hall-island" data-id="all" class="${hallIsland==='all'?'active':''}" aria-pressed="${hallIsland==='all'}">Alle Klassen</button>${ISLANDS.map(i=>`<button data-action="hall-island" data-id="${i.id}" class="${i.id===hallIsland?'active':''}" aria-pressed="${i.id===hallIsland}">${i.grade}</button>`).join('')}</div>${island?`<div class="place-filters" aria-label="Trophäen nach Ort"><button data-action="hall-place" data-id="all" class="${hallPlace==='all'?'active':''}" aria-pressed="${hallPlace==='all'}">Alle Orte</button>${places.map(p=>`<button data-action="hall-place" data-id="${p.id}" class="${hallPlace===p.id?'active':''}" aria-pressed="${hallPlace===p.id}">${authored(placeTitle(island,p))}</button>`).join('')}</div>`:''}<div class="collection compact-collection">${items.map(l=>{const i=ISLANDS.find(x=>x.id===l.islandId),won=progress(i.id,l.number).completed,r=rewardSpec(l);return `<button class="panel trophy-card ${won?'unlocked':'locked'}" data-action="trophy" data-id="${i.id}" data-number="${l.number}" aria-label="${esc(r.name)}, ${i.grade}, Mission ${l.label}${won?', gesammelt':', noch geschlossen'}"><span class="trophy-status">${won?'✓':'🔒'}</span><div class="dragon-stage">${won?trophyArt(l,i):`<div class="planned-trophy">${trophyArt(l,i,false)}</div>`}</div><h3>${esc(r.name)}</h3><small>${i.grade} · ${l.label}</small></button>`;}).join('')}</div>${items.length?'':`<div class="collection-empty"><div>${petArt('penguin','#70b6d1')}</div><h2>${earned.length?'Hier wartet dein nächster Schatz.':'Dein erster Schatz wartet!'}</h2><button class="btn" data-action="home">Mission auswählen →</button></div>`}`;}

function independentCount(records){return records.filter(r=>!r.guided).length;}
function firstCorrectCount(records){return records.filter(r=>!r.guided&&r.attempts===1).length;}
function compareRounds(a,b){return independentCount(a.records)*b.records.length-independentCount(b.records)*a.records.length||firstCorrectCount(a.records)*b.records.length-firstCorrectCount(b.records)*a.records.length;}
function copyRound(h){return {date:h.date,records:h.records.map(r=>({...r})),...(h.reflection?{reflection:h.reflection}:{})};}
function chooseBest(rounds,prior=null){let best=prior?copyRound(prior):null;for(const h of rounds)if(!best||compareRounds(h,best)>0)best=copyRound(h);return best;}
function cleanRound(h,level){if(!h||!validDate(h.date))throw Error('Abenteuerdatum ungültig.');const records=cleanRecords(h.records,level);if(![5,10].includes(records.length))throw Error('Abenteuerdaten ungültig.');if(h.reflection!==undefined&&!Object.hasOwn(REFLECTION_CHOICES,h.reflection))throw Error('Lernrückblick ungültig.');return {date:h.date,records,...(h.reflection?{reflection:h.reflection}:{})};}
function knownSparks(progress){return Object.values(progress).reduce((sum,pr)=>sum+progressSparks(pr),0);}
function progressSparks(pr){return pr.sparks??(pr.rounds??pr.history.length)*10+(pr.run?.records.length||0);}
function ensureLearning(p=profile()){if(!p)return {sparks:0,readLetters:[]};if(!p.learning)p.learning={sparks:knownSparks(p.progress),readLetters:[]};return p.learning;}
function pendingSparks(p=profile()){return p?Object.values(p.progress).filter(pr=>pr.run?.solved).length:0;}
function sparkTotal(p=profile()){return ensureLearning(p).sparks+pendingSparks(p);}
function totalRounds(p=profile()){return p?Object.values(p.progress).reduce((sum,pr)=>sum+(pr.rounds??pr.history.length),0):0;}
function growthStage(p=profile()){const count=sparkTotal(p);let index=0;for(let n=0;n<GROWTH_STAGES.length;n++)if(count>=GROWTH_STAGES[n].at)index=n;return {...GROWTH_STAGES[index],index,next:GROWTH_STAGES[index+1]||null,count};}
function grownDragon(color,animated=true){const g=growthStage();return `<div class="growing-dragon" style="--dragon-scale:${g.scale}" aria-label="Dein Drache wächst mit deiner Übungsreise">${dragon(color,animated)}</div>`;}
function bigFlame(count){return `<div class="growing-fire" style="--fire-size:${70+Math.min(80,Math.sqrt(count)*2.5)}px" role="img" aria-label="${count} gesammelte ${currentWorld().token}">${tokenIcon()}</div>`;}
function bestSummary(id,number){const pr=progress(id,number),best=pr.best||chooseBest(pr.history);return best?`<span class="best-summary"><strong>Beste Runde: ${independentCount(best.records)}/${best.records.length} selbst gelöst</strong></span>`:'';}
function saveReflection(key){if(!Object.hasOwn(REFLECTION_CHOICES,key)||!currentIsland||!currentLevel)return;const pr=gameProgress(),last=pr.history.at(-1);if(!last)return;last.reflection=key;if(pr.best?.date===last.date)pr.best.reflection=key;save();renderReward();toast('Gespeichert.');}
function nextTask(){const pr=gameProgress(),r=pr.run;if(!r?.solved)return;const learning=ensureLearning(),committed=progressSparks(pr);r.records.push({task:runOffset(r)+r.idx,answer:taskAnswer(currentTask(r)),attempts:r.attempts,hint:r.hint,guided:r.guided});r.idx++;learning.sparks++;pr.sparks=committed+1;const milestone=learning.sparks%100===0?learning.sparks:null;if(r.idx===runTotal(r)){const round={date:new Date().toISOString(),records:r.records};pr.best=chooseBest([round],pr.best||chooseBest(pr.history));pr.rounds=(pr.rounds??pr.history.length)+1;pr.history.push(round);pr.history=pr.history.slice(-200);pr.completed=true;pr.run=null;save();renderReward();render();}else{r.attempts=0;r.hint=false;r.solved=false;r.guided=false;save();renderTask();}if(milestone)toast(`${milestone} Funken! Neue Post für dich ✉`);}
function learningBanner(){const g=growthStage();return `<section class="learning-banner compact-banner"><div class="banner-flame">${bigFlame(g.count)}</div><strong>${g.count} ${currentWorld().token}</strong><button class="btn light" data-action="growth">Mein Begleiter →</button></section>`;}

 horses:{title:'Ein Team mit deinem Pferd',goal:'Vertrauen, Pflege und gemeinsame Ausritte',unit:'Hofrunden',areas:['Martinshof','Pferdewiese','Reiterhof','Waldkoppel','Freundschaftshof'],places:['Kennenlernen am Stall','Putzen & Pflegen','Pferdewissen','Üben auf dem Reitplatz','Gemeinsamer Ausritt'],chapters:[['Wir lernen uns kennen','Bibi und Tina zeigen dir den Martinshof. Sabrina und Amadeus stehen am Stall. Du beobachtest dein Pferd ruhig und lernst, was es mag. Eure Freundschaft beginnt mit kleinen Schritten.'],['Pflege schafft Vertrauen','Tina zeigt dir die Bürsten und begleitet dich beim Putzen. Ihr lasst euch Zeit. Dein Pferd lernt dich besser kennen, und du entdeckst seine freundlichen Signale.'],['Mehr über Pferde wissen','Auf dem Hof lernst du Futter, Wasser und Pferdeausrüstung kennen. Du darfst Fragen stellen und dir Dinge noch einmal zeigen lassen. Wissen und Vertrauen wachsen zusammen.'],['Gemeinsam üben','Mit Tina übst du auf dem Reitplatz. Ihr beginnt mit kleinen Aufgaben und probiert sie in Ruhe erneut. Eine Pause hilft euch, aufmerksam weiterzumachen.'],['Unser erster Ausritt','Bibi und Tina begleiten euch auf einen gemeinsamen Ausritt. Du erinnerst dich an eure Übungen und achtest auf dein Pferd. Ihr seid ein Team geworden und lernt weiter zusammen.']]}

const JOURNEY_STEPS=[0,3,8,15,25];
function journey(){return JOURNEYS[currentWorld().id];}
function journeyStage(){const rounds=totalRounds();let index=0;JOURNEY_STEPS.forEach((n,k)=>{if(rounds>=n)index=k;});const j=journey();return {index,rounds,title:j.chapters[index][0],next:JOURNEY_STEPS[index+1]??null,remaining:(JOURNEY_STEPS[index+1]??rounds)-rounds};}
function chapterFor(level){return Math.max(0,Math.min(4,level.placeIndex-1));}
function authored(text){return `<span data-authored>${esc(text)}</span>`;}
function placeTitle(i,p){return currentWorld().id==='dragon'?p.name:journey().places[ISLAND_LAYOUT[i.id].indexOf(p)];}
function areaTitle(i){return journey().areas[ISLANDS.indexOf(i)];}

 if(w.id==='dragon')return after?'Ihr habt einen Rechenweg entdeckt. Die Insel leuchtet ein Stück heller.':level.story.split(/(?<=[.!?])\s+/).slice(0,2).join(' ');
 const tasks={football:['Ihr probiert einen neuen Passweg.','Ihr übt gemeinsam einen Spielzug.','Ihr schaut euch eine knifflige Spielsituation an.','Ihr plant, wie das Team einander helfen kann.','Ihr verbessert euren Trainingsplan.','Ihr probiert nach einer Pause erneut.','Ihr entdeckt einen neuen Weg zum Tor.'],blocks:['Ihr plant den Eingang.','Ihr baut die ersten Wände.','Ihr verbessert ein Fenster.','Ihr verbindet zwei Bauplätze.','Ihr baut einen neuen Garten.','Ihr prüft die Dachform.','Ihr ergänzt eine leuchtende Idee.'],jungle:['Ihr folgt einer neuen Spur.','Ihr vergleicht Blätter und Farben.','Ihr hört ein unbekanntes Tier.','Ihr beobachtet den Fund genauer.','Ihr zeichnet eure Entdeckung.','Ihr entdeckt eine neue Pflanze.','Ihr sucht einen zweiten Hinweis.'],fairytale:['Ihr entschlüsselt ein kleines Rätsel.','Ihr sucht einen neuen Weg.','Ihr betrachtet ein Muster genauer.','Ihr probiert eine neue Idee.','Ihr helft einem Schlossfreund.','Ihr verbessert eure Karte.','Ihr öffnet eine weitere Tür.'],horses:['Ihr beobachtet euer Pferd.','Ihr lernt einen kleinen Pflegeschritt.','Ihr übt aufmerksam zusammen.','Ihr lasst euch etwas noch einmal zeigen.','Ihr entdeckt ein neues Pferdesignal.','Ihr verbessert eure Absprache.','Ihr nehmt euch Zeit für eine Pause.']};
 const entry=j.chapters[chapter][1].split(/(?<=[.!?])\s+/).slice(0,2).join(' '),activity=tasks[w.id][(sub-1)%7];
 if(after){const success={football:'Euer Team hat einen Spielzug ausprobiert. Das Training geht weiter!',blocks:'Ein neuer Bauteil kommt dazu. Eure Welt wächst!',jungle:'Eine neue Entdeckung kommt in euer Forscherbuch!',fairytale:'Ein weiteres Schlossrätsel ist gelöst. Eure Geschichte geht weiter!',horses:'Ihr habt gemeinsam geübt. Die Freundschaft zu eurem Pferd wächst!'};return (replay?'Du hast einen vertrauten Weg erneut geübt. ':'')+success[w.id];}
 return (replay?'Ihr kehrt zurück und probiert den nächsten Rechenweg. ':entry+' ')+activity;
}
function missionStory(level,island){return shortStory(level,island);}
function storyRibbon(){const j=journey(),g=journeyStage();return `<section class="journey-ribbon"><div><span class="eyebrow">${authored(j.title)}</span><strong>${authored(g.title)}</strong><small>${authored(g.next?g.remaining+' '+j.unit+' bis „'+j.chapters[g.index+1][0]+'“':'Neue Ideen warten auf euch.')}</small></div><button class="btn light" data-action="growth">Abenteuerbuch →</button></section>`;}
function storyBook(){const j=journey(),g=journeyStage();return `<section class="panel story-book"><div class="collection-heading"><h2>${authored(j.title)}</h2><span class="pill">${g.rounds} ${authored(j.unit)}</span></div><div class="story-chapters">${j.chapters.map(([title,text],n)=>`<details class="story-chapter ${n<=g.index?'discovered':'future'}" ${n===g.index?'open':''}><summary><span class="chapter-stamp">${n<g.index?'✓':n+1}</span><span>${authored(title)}<small>${n===g.index?'Euer Kapitel':n<g.index?'Entdeckt':JOURNEY_STEPS[n]+' '+j.unit}</small></span></summary><div class="chapter-illustration">${chapterArt(currentWorld(),n)}</div><p>${authored(n<=g.index?text:'Hier führt eure Reise hin. '+text.split(/(?<=[.!?])\s+/)[0])}</p></details>`).join('')}</div></section>`;}

for(const [name,body] of objectPrizes)addPrize(name,typeof body==='function'?()=>body():prizeBody(body));
function prizeIndex(level){const id=level.islandId,n=level.number;if(level.legacy)return id==='grade2'?112:113;const grade=ISLANDS.findIndex(i=>i.id===id);if(grade===0&&n<=20)return n-1;if(grade===1&&n<=20)return 20+n-1;if(grade===2&&n>=21&&n<=40)return 40+n-21;if(grade===3&&n>=21&&n<=52)return 60+n-21;if(grade===4&&n<=20)return 92+n-1;return 114+grade*101+n;}
const PRIZE_ORDER=(()=>{const fixed=new Map([[0,0],[20,1],[40,2],[41,3],[42,4],[43,5],[44,6],[45,7],[46,8],[60,9],[61,10],[62,11],[63,12],[64,13],[65,14],[66,15],[67,16],[68,17],[69,18],[70,19],[71,20],[92,21]]),used=new Set(fixed.values()),rest=Array.from({length:114},(_,n)=>n).filter(n=>!used.has(n));return Array.from({length:114},(_,n)=>fixed.has(n)?fixed.get(n):rest.shift());})();
function rewardSpec(level){const slot=prizeIndex(level),index=PRIZE_ORDER[slot]??slot,p=UNIQUE_PRIZES[index];return {index,kind:p?.id||'future-'+level.key,name:p?.name||'Baukunst '+level.label,hash:index};}
function futurePrizeArt(index){const towers=Array.from({length:6},(_,n)=>`<path d="M${25+n*27} 160V${40+(index>>(n*2)&7)*11}h21V160z" fill="${['#a8c6bb','#b6acce','#d6bd88'][n%3]}"/>`).join('');return prizeBody(towers);}
function trophyArt(level,island,animated=true){const r=rewardSpec(level),p=UNIQUE_PRIZES[r.index],w=currentWorld(),body=p?(typeof p.body==='function'?p.body(animated):p.body):futurePrizeArt(r.index);let emblem=w.id==='football'?'<path d="M13 35h18v16q-9 16-18 0zm9 26v9" fill="#d3bc7c"/>':w.id==='blocks'?'<path d="M17 32l17 9v19l-17-9zM17 32l14-9 18 9-15 9M34 41l15-9v19l-15 9" fill="#a7bfa0"/>':w.id==='jungle'?'<path d="M17 67q-10-32 22-41 10 36-22 41" fill="#a6bd88"/>':w.id==='fairytale'?'<path d="M12 56l-4-22 12 9 7-15 8 15 12-9-4 22z" fill="#d7c08f"/>':w.id==='horses'?'<path d="M16 62q-16-35 12-37 27 2 12 37l-9-5q9-21-3-21-13 0-3 21z" fill="#bfb8a2"/>':'<path d="M20 66q-20-17 6-40-2 20 11 18 8 23-17 22" fill="#dfb381"/>';
 return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" data-prize="${r.kind}"><circle cx="120" cy="112" r="94" fill="${w.land}" opacity=".16"/>${emblem}<svg x="20" y="15" width="200" height="190" viewBox="0 0 200 200"><g class="${animated?'float-dragon':''}" data-prize-body="${r.kind}">${body}</g></svg><ellipse cx="120" cy="211" rx="65" ry="10" fill="#e2ca92"/><path d="M55 211v10q65 21 130 0v-10" fill="#cbb076"/><path d="M112 211l8-10 8 10-8 9z" fill="#fff1be"/></svg>`;
}

function renderWorlds(){$('#app').innerHTML=`<section class="world-intro"><span class="eyebrow">Dein Matheabenteuer</span><h1>Welche Geschichte wählst du?</h1></section><div class="world-grid">${WORLDS.map(w=>`<button class="world-card ${w.id===currentWorld().id?'selected':''}" data-action="choose-world" data-id="${w.id}" aria-label="${esc(w.name)} auswählen"><div class="world-preview" style="--card-sky:${w.sky};--card-land:${w.land}">${worldScene(w,w.id==='fairytale'?1:w.id==='football'?4:0)}<div class="world-pet">${w.id==='dragon'?dragonArt('#62ac98',true):w.id==='fairytale'?princessArt(1):petArt(w.pet,w.color,true)}</div></div><strong>${w.name}</strong><small>${esc(JOURNEYS[w.id].goal)}</small></button>`).join('')}</div>`;}
function renderHome(){const p=profile(),w=currentWorld(),pos=[[3,9],[51,2],[29,35],[2,64],[57,65]],s=ISLANDS.find(i=>i.id===selected);$('#app').innerHTML=`<section class="hero"><div><button class="world-switch" data-action="worlds">${w.name} <span aria-hidden="true">↔</span></button><h1>${p?'Hallo, '+personalName(p)+'!':'Dein Abenteuer beginnt.'}</h1><p>Wähle deine Klasse.</p></div></section>${storyRibbon()}${learningBanner()}<div class="layout"><section class="ocean world-overview" data-overview="${w.id}" aria-label="Karte mit fünf Klassen"><span class="map-label">${authored(journey().title)}</span>${ISLANDS.map((i,n)=>`<button class="island-card ${selected===i.id?'selected':''}" style="left:${pos[n][0]}%;top:${pos[n][1]}%" data-action="select" data-id="${i.id}" aria-pressed="${selected===i.id}" aria-label="${i.grade}: ${esc(areaTitle(i))}">${landscape(i)}${islandLevels(i.id).some(l=>progress(i.id,l.number).completed)?'<span class="done" aria-hidden="true">✓</span>':''}<span class="island-name">${i.grade}<small>${authored(areaTitle(i))}</small></span></button>`).join('')}</section><aside class="side"><section class="panel island-detail"><span class="pill">${s.grade}</span><div class="mini-art">${landscape(s)}</div><h2>${authored(areaTitle(s))}</h2><p>${s.tag}</p><div class="facts"><span>5 Aufgaben pro Runde</span><span>${islandLevels(s.id).filter(l=>l.available).length} Missionen bereit</span></div><button class="btn" data-action="island" data-id="${s.id}">Geschichte erleben →</button></section></aside></div>`;}
function renderIsland(){const i=ISLANDS.find(x=>x.id===selected),places=ISLAND_LAYOUT[i.id],place=places.find(p=>p.id===selectedPlace)||places[0];selectedPlace=place.id;const levels=place.levels.map(n=>getLevel(i.id,n)),total=islandLevels(i.id).length,chapter=places.indexOf(place),w=currentWorld();$('#app').innerHTML=`<div class="back-row"><button class="linkbtn" data-action="home">← Klassen</button><span class="pill">${i.grade} · ${total} Drachenmissionen</span></div><section class="hero"><div><div class="eyebrow">${w.name}</div><h1>${authored(areaTitle(i))}</h1></div></section>${storyRibbon()}<div class="layout"><section class="island-map" data-map-world="${w.id}" aria-label="${w.id==='dragon'?'Inselkarte':'Abenteuerkarte'} mit ${places.length} unterschiedlichen Orten">${islandTerrain(i)}${places.map((p,n)=>{const stats=placeProgress(i.id,p);return `<button class="level-node ${stats.available?'available':'locked'} ${p.id===place.id?'selected-place':''}" style="left:${p.position[0]}%;top:${p.position[1]}%" data-action="place" data-id="${p.id}" aria-pressed="${p.id===place.id}" aria-controls="placeDetail" aria-label="${esc(placeTitle(i,p))}, ${stats.completed} von ${stats.total} Missionen geschafft"><span class="landmark-art">${worldLandmark(i,p)}<span class="level-badge" aria-hidden="true">${stats.completed===stats.total?'✓':n+1}</span></span><span class="label"><strong>${authored(placeTitle(i,p))}</strong><small>${stats.completed}/${stats.total} geschafft</small><span class="place-beads" aria-hidden="true">${p.levels.map(number=>`<i class="${progress(i.id,number).completed?'earned':''}"></i>`).join('')}</span></span></button>`;}).join('')}</section><aside class="side"><section class="panel place-detail" id="placeDetail"><span class="eyebrow">Kapitel ${chapter+1}</span><h2>${authored(placeTitle(i,place))}</h2><p class="chapter-hook">${authored(journey().chapters[chapter][1].split(/(?<=[.!?])\s+/)[0])}</p><div class="sublevel-list">${levels.map(l=>{const pr=progress(i.id,l.number);return `<button class="sublevel-card ${pr.completed?'completed':''}" ${l.available?`data-action="play" data-id="${i.id}" data-number="${l.number}"`:'disabled'}><span class="sublevel-number">${pr.completed?'✓':l.label}</span><span><strong>${l.available?esc(l.title):'Mission '+l.label}</strong><small>${l.available?pr.run?'Weiter · '+pr.run.idx+'/'+runTotal(pr.run):pr.completed?'Noch einmal üben':'5 Aufgaben':'Bald verfügbar'}</small>${l.available?bestSummary(i.id,l.number):''}</span>${l.available?'<span class="sublevel-arrow" aria-hidden="true">→</span>':''}</button>`;}).join('')}</div></section></aside></div>${bonusPanel(i.id)}`;}
function renderGameStory(){$('#gameBody').innerHTML=gameHeader()+`<div class="story"><div class="mission-scene">${chapterArt(currentWorld(),chapterFor(currentLevel))}</div><div class="eyebrow">Mission ${currentLevel.label} · ${authored(placeTitle(currentIsland,currentLevel.location))}</div><h2>${esc(currentLevel.title)}</h2><p>${authored(missionStory(currentLevel,currentIsland))}</p><button class="btn" data-action="begin">Los geht’s →</button><p class="small">${runTotal()} Aufgaben</p></div>`;}
function renderReward(){const pr=gameProgress(),reflection=pr.history.at(-1)?.reflection,r=rewardSpec(currentLevel);$('#gameBody').innerHTML=`<button class="icon-btn close" data-action="pause" aria-label="Zur Karte zurückkehren">×</button><div class="story"><div class="eyebrow">Mission ${currentLevel.label} · geschafft!</div><div class="reward-stage">${trophyArt(currentLevel,currentIsland)}</div><h2>${esc(r.name)} freigespielt!</h2><p class="story-next">${authored(shortStory(currentLevel,currentIsland,true))}</p><span class="pill">${pr.history.at(-1).records.length}/${pr.history.at(-1).records.length} Aufgaben geschafft ✦</span><div class="reward-actions"><button class="btn" data-action="reward-collection">Mein Schatz →</button><button class="btn light" data-action="reward-repeat">Noch einmal üben</button><button class="linkbtn" data-action="reward-growth">Abenteuerbuch</button></div><details class="reflection-box"><summary>Was hat dir geholfen?</summary><div class="reflection-options">${Object.entries(REFLECTION_CHOICES).map(([key,label])=>`<button class="${reflection===key?'chosen':''}" data-action="reflect" data-id="${key}" aria-pressed="${reflection===key}">${label}</button>`).join('')}</div></details></div>`;}
function renderGrowth(){const p=profile(),g=growthStage(),companion=ISLANDS.find(i=>i.id===hallIsland)||ISLANDS.find(i=>i.id===selected)||ISLANDS[1],learn=ensureLearning(p),milestones=Math.floor(g.count/100),pages=Math.max(1,Math.ceil(milestones/6)),j=journey(),stage=journeyStage(),buddy=currentWorld().id==='fairytale'?['Arielle','Belle','Jasmin','Rapunzel','Elsa'][stage.index]:worldText(companion.dragon);postPage=Math.max(0,Math.min(postPage,pages-1));const letters=Array.from({length:Math.max(0,Math.min(6,milestones-postPage*6))},(_,n)=>100*(milestones-postPage*6-n));$('#app').innerHTML=`<section class="hero"><div><span class="eyebrow">${currentWorld().name}</span><h1>Dein Abenteuerbuch</h1></div></section>${storyRibbon()}<div class="growth-panels"><section class="panel growth-companion"><button class="growth-dragon-stage companion-hop" data-action="hop" aria-label="Begleiter bewegen">${grownDragon(companion.color)}</button><h2>${authored(buddy)}</h2><p class="small muted">${authored(stage.title)} · ${stage.rounds} ${authored(j.unit)}</p><div class="growth-stages" aria-label="Wachstumsstufen">${GROWTH_STAGES.map((n,k)=>`<span class="${k<=g.index?'reached':''}"><i aria-hidden="true">${k<g.index?'✓':k===g.index?'✦':'·'}</i><small>${n.at===0?'Start':n.at}</small></span>`).join('')}</div></section><section class="panel flame-overview"><div class="journey-growth-art">${worldScene(currentWorld(),stage.index)}</div>${bigFlame(g.count)}<strong class="fire-total">${g.count}</strong><p>${currentWorld().token}</p></section></div>${worldDiscoveries()}${storyBook()}<section class="dragon-post"><div class="collection-heading"><h2>Deine Post ✉</h2><span class="pill">Alle 100 Funken</span></div>${letters.length?`<div class="letter-grid">${letters.map(at=>`<button class="letter-card ${learn.readLetters.includes(at)?'read':'unread'}" data-action="letter" data-number="${at}"><span class="envelope" aria-hidden="true">✉</span><span><strong>${at} Funken</strong><small>${learn.readLetters.includes(at)?'Noch einmal lesen':'Neu! Öffnen →'}</small></span></button>`).join('')}</div>${pages>1?`<div class="post-pagination"><button class="btn light" data-action="post-page" data-number="${postPage-1}" ${postPage===0?'disabled':''}>← Neuer</button><span class="small muted">${postPage+1} / ${pages}</span><button class="btn light" data-action="post-page" data-number="${postPage+1}" ${postPage>=pages-1?'disabled':''}>Älter →</button></div>`:''}`:'<div class="empty-post"><span aria-hidden="true">✉</span><p>Dein erster Brief kommt bei 100 Funken.</p></div>'}</section>`;}
function letterIllustration(i,theme){const w=currentWorld(),n=((theme.scene==='paths'?0:theme.scene==='book'?1:theme.scene==='help'?2:theme.scene==='bridge'?3:4)),scene=worldScene(w,n).replace(/^<svg[^>]*>|<\/svg>$/g,'');return `<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dein Begleiter in ${esc(w.name)}" data-letter-scene="${theme.scene}"><rect width="480" height="250" rx="24" fill="${w.sky}"/><path d="M0 194Q210 136 480 185v65H0z" fill="${w.land}"/><svg x="235" y="24" width="230" height="210" viewBox="0 0 200 180">${scene}</svg><svg x="36" y="41" width="203" height="203" viewBox="0 0 200 200">${artInner(worldCompanion(i.color,true))}</svg><path d="M219 68l5-12 5 12-5 12zM434 28l4-9 4 9-4 9z" fill="#fff0be"/></svg>`;}
function openLetter(at){if(!profile()||!Number.isInteger(at)||at<100||at%100||at>sparkTotal())return;const learn=ensureLearning();if(!learn.readLetters.includes(at)){learn.readLetters.push(at);save();}const i=ISLANDS[(at/100-1)%ISLANDS.length],theme=LETTER_THEMES[(at/100-1)%LETTER_THEMES.length],g=journeyStage();$('#letterBody').innerHTML=`<button class="icon-btn close" data-action="close-letter" aria-label="Brief schließen">×</button><div class="letter-content"><span class="pill">Post · ${at} Funken</span><div class="letter-illustration">${letterIllustration(i,theme)}</div><h2>${authored(g.title)}</h2><p>Hallo ${personalName(profile())},</p><p>${authored({dragon:'Unsere Inseln leuchten mit jedem Lernschritt heller.',football:'Danke für unser Training! Wir entdecken neue Spielzüge und wachsen als Team.',blocks:'Danke fürs Mitbauen! Jede neue Idee macht unsere Welt ein Stück größer.',jungle:'Danke fürs genaue Hinsehen! Unsere Entdeckungsreise geht weiter.',fairytale:'Danke für deine Ideen! Hinter der nächsten Schlosstür wartet ein neues Rätsel.',horses:'Danke für deine Geduld! Du und dein Pferd lernt immer mehr voneinander.'}[currentWorld().id])}</p><blockquote class="encouragement"><span class="encouragement-label">Dein Mutmach-Spruch</span>„${theme.motto}“</blockquote><button class="btn" data-action="close-letter">Aufbewahren ✓</button></div>`;if(!$('#letterDialog').open)$('#letterDialog').showModal();if(view==='growth')renderGrowth();}


for(const w of WORLDS){if(w.id!=='dragon'){w.areas=[...JOURNEYS[w.id].areas];w.places=[...JOURNEYS[w.id].places];}}
WORLDS.find(w=>w.id==='fairytale').names=['Arielle','Belle','Jasmin','Rapunzel','Elsa'];

// Themes affect rendering only. Mission IDs, answers and progress remain shared.
for(const [name,selector] of [['renderHome','#app'],['renderIsland','#app'],['renderTrophies','#app'],['renderGrowth','#app'],['renderGameStory','#gameBody'],['renderTask','#gameBody'],['renderReward','#gameBody'],['openLetter','#letterBody']]){
 const original={renderHome,renderIsland,renderTrophies,renderGrowth,renderGameStory,renderTask,renderReward,openLetter}[name];
 const themed=function(...args){const result=original(...args);const el=$(selector);const context=selector==='#gameBody'?currentIsland:name==='renderTrophies'?ISLANDS.find(i=>i.id===hallIsland):null;el.innerHTML=themedMarkup(el.innerHTML,context);return result;};
 if(name==='renderHome')renderHome=themed;else if(name==='renderIsland')renderIsland=themed;else if(name==='renderTrophies')renderTrophies=themed;else if(name==='renderGrowth')renderGrowth=themed;else if(name==='renderGameStory')renderGameStory=themed;else if(name==='renderTask')renderTask=themed;else if(name==='renderReward')renderReward=themed;else openLetter=themed;
}

render();
</script>
</body>
</html>
