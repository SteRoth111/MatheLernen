function diceWays(sum){let count=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a+b===sum)count++;return count;}
function statementTruth(t){return t.mode===0?t.values[t.a]>t.values[t.b]:t.mode===1?t.values[t.a]===Math.max(...t.values):t.mode===2?t.values[t.a]<t.values[t.b]:t.values[t.a]===t.claimed;}
function clockText(minutes){return String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');}
function euroText(cents){return Math.floor(cents/100)+' € '+String(cents%100).padStart(2,'0')+' ct';}
function taskLimit(t){return t.type==='money'&&!t.whole?10000:t.type==='clock'?1439:1000;}
function numericTaskAnswer(t){
 switch(t.type){
  case 'parity':return t.number%2;
  case 'bond':return t.total-t.number;
  case 'neighbor':return t.number+(t.direction==='previous'?-1:1);
  case 'hundredCount':case 'rods':case 'numberLine':return t.number;
  case 'hundredNeighbor':return t.number+({up:-10,right:1,down:10,left:-1})[t.direction];
  case 'array':return t.mode==='equations'?t.correct:t.rows*t.cols;
  case 'money':return t[t.ask]/(t.whole?100:1);
  case 'clock':return t.hour*60+t.minute;
  case 'elapsed':return t.end-t.start;
  case 'lengthUnits':return t.cm;
  case 'lengthCompare':return t.base+t.delta;
  case 'chart':return t.values[t.target];
  case 'chartStatement':return statementTruth(t)?0:1;
  case 'dicePair':return t.sum-t.first;
  case 'diceCount':return diceWays(t.sum);
  case 'diceChance':return diceWays(t.a)>diceWays(t.b)?0:1;
  case 'solid':return t.shape;
  case 'view':return t.direction;
  case 'pattern':return t.pattern[0];
  default:return NaN;
 }
}
function validateObjectTask(t,range){
 if(!t||typeof t!=='object'||Array.isArray(t))return false;
 const whole=(v,min,max)=>Number.isInteger(v)&&v>=min&&v<=max;
 let valid=false;
 switch(t.type){
  case 'parity':valid=whole(t.number,0,range);break;
  case 'bond':valid=whole(t.total,1,range)&&whole(t.number,0,t.total);break;
  case 'neighbor':valid=whole(t.number,0,range)&&['previous','next'].includes(t.direction);break;
  case 'hundredCount':case 'rods':case 'numberLine':valid=whole(t.number,0,100);break;
  case 'hundredNeighbor':valid=whole(t.number,1,100)&&['up','right','down','left'].includes(t.direction)&&whole(numericTaskAnswer(t),1,100)&&!(t.direction==='right'&&t.number%10===0)&&!(t.direction==='left'&&t.number%10===1);break;
  case 'array':valid=whole(t.rows,1,10)&&whole(t.cols,1,10)&&['equations','count'].includes(t.mode)&&(t.mode==='count'||whole(t.correct,0,3));break;
  case 'money':valid=['price','paid','change'].includes(t.ask)&&[t.price,t.paid,t.change].every(v=>whole(v,0,10000))&&t.paid-t.price===t.change&&typeof t.whole==='boolean'&&(!t.whole||[t.price,t.paid,t.change].every(v=>v%100===0));break;
  case 'clock':valid=whole(t.hour,0,23)&&whole(t.minute,0,59);break;
  case 'elapsed':valid=whole(t.start,0,1439)&&whole(t.end,t.start+1,1439)&&t.end-t.start<=1000;break;
  case 'lengthUnits':valid=whole(t.cm,0,1000)&&['toCm','toParts'].includes(t.mode);break;
  case 'lengthCompare':valid=whole(t.base,0,1000)&&Number.isInteger(t.delta)&&Math.abs(t.delta)<=1000;break;
  case 'chart':case 'chartStatement':valid=Array.isArray(t.values)&&t.values.length===5&&t.values.every(v=>whole(v,0,50))&&(t.type==='chart'?whole(t.target,0,4):whole(t.mode,0,3)&&whole(t.a,0,4)&&whole(t.b,0,4)&&whole(t.claimed,0,50));break;
  case 'dicePair':valid=whole(t.sum,2,12)&&whole(t.first,1,6)&&whole(t.sum-t.first,1,6);break;
  case 'diceCount':valid=whole(t.sum,2,12);break;
  case 'diceChance':valid=whole(t.a,2,12)&&whole(t.b,2,12)&&diceWays(t.a)!==diceWays(t.b);break;
  case 'solid':valid=whole(t.shape,0,2)&&whole(t.variant,0,2);break;
  case 'view':valid=whole(t.direction,0,3);break;
  case 'pattern':valid=Array.isArray(t.pattern)&&t.pattern.length>=2&&t.pattern.length<=4&&t.pattern.every(v=>whole(v,0,3))&&new Set(t.pattern).size===t.pattern.length;break;
 }
 const answer=numericTaskAnswer(t);
 return valid&&Number.isInteger(answer)&&answer>=0&&answer<=taskLimit(t)&&(!['neighbor','parity','bond'].includes(t.type)||answer<=range);
}
function choiceOptions(t){
 if(t.type==='parity')return ['Gerade','Ungerade'];
 if(t.type==='chartStatement')return ['Stimmt','Stimmt nicht'];
 if(t.type==='diceChance')return ['Summe '+t.a,'Summe '+t.b];
 if(t.type==='solid')return ['Würfel','Quader','Kugel'];
 if(t.type==='view')return [0,1,2,3].map(n=>({html:viewPhoto(n),label:'Ansicht '+String.fromCharCode(65+n)}));
 if(t.type==='pattern')return [0,1,2,3].map(n=>({html:patternTile(n),label:'Musterstück '+String.fromCharCode(65+n)}));
 if(t.type==='array'&&t.mode==='equations'){const r=t.rows,c=t.cols;const correct=`${r} · ${c} und ${c} · ${r}`,wrong=[`${r+1} · ${c} und ${c} · ${r+1}`,`${r} · ${c+1} und ${c+1} · ${r}`,`${r} · 1 und 1 · ${r}`];wrong.splice(t.correct,0,correct);return wrong;}
 return null;
}

function submitTaskAnswer(){const t=currentTask();let ids,scales;
 if(t.type==='clock'){ids=['answerHours','answerMinutes'];scales=[60,1];}
 else if(t.type==='money'&&!t.whole){ids=['answerEuros','answerCents'];scales=[100,1];}
 else if(t.type==='lengthUnits'&&t.mode==='toParts'){ids=['answerMeters','answerCentimeters'];scales=[100,1];}
 else {const value=$('#answer').value;if(value.trim()==='')return;checkAnswer(Number(value));return;}
 const values=ids.map(id=>$('#'+id).value);if(values.some(v=>v.trim()===''))return;
 const numbers=values.map(Number),limits=t.type==='clock'?[23,59]:t.type==='money'?[100,99]:[10,99];
 if(numbers.some((v,n)=>!Number.isInteger(v)||v<0||v>limits[n])){renderTask('Prüfe die beiden Eingabefelder und ihre angegebenen Bereiche.','retry');return;}
 checkAnswer(numbers.reduce((sum,v,n)=>sum+v*scales[n],0));
}

function navUpdate(){for(const n of ['home','trophies','growth','parents']){$('#nav-'+n).classList.toggle('active',n===(view==='island'?'home':view));$('#nav-'+n).setAttribute('aria-current',n===(view==='island'?'home':view)?'page':'false');}const p=profile();$('#profileButton').innerHTML=`<span class="avatar">${dragon(p?.color)}</span>${p?esc(p.name):'Profil wählen'} <span aria-hidden="true">⌄</span>`;document.body.classList.toggle('calm',state.calm);}

function renderHome(){const p=profile(),earned=completedLevels().length;const pos=[[3,9],[51,2],[29,35],[2,64],[57,65]];const s=ISLANDS.find(i=>i.id===selected);$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">Eine Welt voller kleiner Wunder</div><h1>${p?'Hallo, '+esc(p.name)+'!':'Dein Abenteuer beginnt.'}<br>Wohin fliegen wir?</h1><p>Entdecke deine Dracheninsel. Löse kleine Rechenzauber und lass deine Trophäensammlung wachsen – in deinem Tempo.</p></div><div class="hero-right"><span class="sun" aria-hidden="true">✦</span><div><strong>${earned} Missionstrophäen</strong><div class="small muted">Jeder Schritt zählt.</div></div></div></section>${learningBanner()}<div class="layout"><section class="ocean" aria-label="Weltkarte mit fünf wählbaren Dracheninseln"><span class="map-label">DAS DRACHENARCHIPEL</span><svg class="world-path" viewBox="0 0 800 540" preserveAspectRatio="none" aria-hidden="true"><path d="M170 115Q520 20 555 113T380 286Q118 270 161 422T590 444" fill="none" stroke="#fff0b5" stroke-width="2" stroke-dasharray="2 12"/></svg>${ISLANDS.map((i,n)=>`<button class="island-card ${selected===i.id?'selected':''}" style="left:${pos[n][0]}%;top:${pos[n][1]}%" data-action="select" data-id="${i.id}" aria-pressed="${selected===i.id}" aria-label="${i.name}, ${i.grade}${islandCompleted(i.id)?', verfügbare Level abgeschlossen':''}">${landscape(i)}${islandLevels(i.id).some(l=>progress(i.id,l.number).completed)?'<span class="done" aria-hidden="true">✦ '+islandLevels(i.id).filter(l=>progress(i.id,l.number).completed).length+'</span>':''}<span class="island-name">${i.name}<small>${i.grade}</small></span></button>`).join('')}<span class="compass" aria-hidden="true">N<b>✧</b>S</span></section><aside class="side"><section class="panel island-detail"><span class="pill">${s.grade}</span><div class="mini-art">${landscape(s)}</div><h2>${s.name}</h2><p>${s.tag}. Begleite ${s.dragon} auf dem ersten Abenteuer deiner Insel.</p><div class="facts"><span>5 Aufgaben</span><span>Ohne Zeitdruck</span><span>${islandLevels(s.id).filter(l=>l.available).length} spielbar · ${ISLAND_LAYOUT[s.id].length} Orte · ${islandLevels(s.id).length} Drachenmissionen</span></div><button class="btn" data-action="island" data-id="${s.id}">Insel entdecken <span aria-hidden="true">→</span></button></section><div class="gentle-note"><span aria-hidden="true">🌱</span><div><b>Du darfst noch lernen.</b>Tipps helfen dir weiter. Alle Inseln stehen dir offen – wähle, was zu dir passt.</div></div></aside></div><div class="bottom-note"><span>Wähle eine Insel auf der Karte. Die Klassenstufe ist eine Orientierung.</span><span>Entdecken · Rechnen · Knobeln</span></div>`;}
function firstTry(records){return records.filter(r=>r.attempts===1&&!r.hint&&!r.guided).length;}

function renderProfiles(){$('#profileBody').innerHTML=`<button class="icon-btn close" data-action="close-profiles" aria-label="Schließen">×</button><h2 class="dialog-heading">Wer reist heute mit?</h2><p class="muted small">Wähle deinen Spitznamen. Die Profile gehören nur zu diesem Browser.</p><div class="profiles">${state.profiles.map(p=>`<div class="profile-row"><button class="btn ${p.id===state.active?'':'light'}" data-action="choose-profile" data-id="${esc(p.id)}">${dragon(p.color)} ${esc(p.name)}${p.id===state.active?' · ausgewählt':''}</button><button class="icon-btn" data-action="delete-profile" data-id="${esc(p.id)}" aria-label="Profil ${esc(p.name)} löschen">×</button></div>`).join('')}</div><form id="profileForm"><div class="field"><label for="profileName">Neues Profil: Dein Spitzname</label><input id="profileName" type="text" maxlength="24" autocomplete="off" placeholder="Zum Beispiel Wolkenfuchs" required></div><button class="btn fullwidth" type="submit" ${state.profiles.length>=20?'disabled':''}>Profil anlegen & losfliegen →</button><p id="profileError" class="small" role="status" style="margin-top:12px"></p></form><p class="small muted" style="margin-top:15px">Keine E-Mail und kein Passwort nötig. Bis zu 20 Kinderprofile.</p>`;}
function renderGameStory(){$('#gameBody').innerHTML=gameHeader()+`<div class="story">${grownDragon(currentIsland.color)}<div class="eyebrow">Drachenmission ${currentLevel.label} · ${esc(currentLevel.place)}</div><h2>${esc(currentLevel.title)}</h2><p>${esc(currentLevel.story)}</p><button class="btn" data-action="begin">Gemeinsam losfliegen →</button><p class="small">${runTotal()} Aufgaben · Tipps jederzeit · Pausen erlaubt</p></div>`;}
function storyTask(t){if(t[3]!=='story')return '';if(t[4])return esc(t[4]);if(currentIsland.id==='grade4'){return t[2]==='+'?`Ember hat ${t[0]} Wärmekristalle gesammelt. In einer Höhle findet er ${t[1]} weitere. Wie viele sind es zusammen?`:`Ember hat ${t[0]} Wärmekristalle. Er bringt ${t[1]} zum Drachenherz. Wie viele bleiben übrig?`;}return '';}
function solvedText(t){if(!Array.isArray(t)){if(!['parity','bond','neighbor'].includes(t.type))return extraSolvedText(t);if(t.type==='parity')return t.number===0?'0 ist gerade: Es bleibt nichts einzeln übrig.':`${t.number} ist ${taskAnswer(t)?'ungerade':'gerade'}. Beim Bilden von Zweierpaaren ${taskAnswer(t)?'bleibt eines allein':'bleibt nichts allein'}.`;if(t.type==='neighbor')return `${t.number} ${t.direction==='previous'?'−':'+'} 1 = ${taskAnswer(t)}. ${taskAnswer(t)} ist der ${t.direction==='previous'?'Vorgänger':'Nachfolger'} von ${t.number}.`;return `${t.number} + ${taskAnswer(t)} = ${t.total}. Diese beiden Zahlen sind Zahlenfreunde.`;}if(t[3]==='missing')return `${t[0]} ${t[2]} ${t[1]} = ${taskResult(t)}. Die fehlende Zahl ist ${t[1]}. Prüfe die vollständige Rechnung.`;const a=t[0],b=t[1];if(['·',':'].includes(t[2]))return `${a} ${t[2]} ${b} = ${taskResult(t)}. `+(t[2]==='·'?`Das sind ${a} Gruppen mit je ${b} Punkten.`:`Die Umkehraufgabe lautet ${b} · ${taskResult(t)} = ${a}.`);if(currentLevel.range<=30)return `${a} ${t[2]} ${b} = ${taskResult(t)}. Lege die Geschichte oder Rechnung mit Punkten nach und prüfe die Menge.`;const parts=[Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(Boolean);let n=a;return parts.map(part=>{const before=n;n=t[2]==='+'?n+part:n-part;return `${before} ${t[2]} ${part} = ${n}`;}).join(' · ')+`. Das Ergebnis ist ${n}.`;}
function beads(t){if(currentLevel.range!==10)return '';return `<div class="beads" aria-label="${t[0]} Ausgangspunkte${t[2]==='+'?', dazu '+t[1]+' weitere':', davon '+t[1]+' wegnehmen'}">${Array.from({length:t[0]},(_,n)=>`<span aria-hidden="true" style="${t[2]==='−'&&n>=t[0]-t[1]?'opacity:.22;text-decoration:line-through':''}">●</span>`).join('')}${t[2]==='+'?'<span aria-hidden="true">+</span>'+Array.from({length:t[1]},()=>'<span aria-hidden="true" style="color:#c49a46">●</span>').join(''):''}</div>`;}
function renderTask(message='',kind=''){
 const r=gameProgress().run,t=currentTask(r),question=taskPrompt(t),choice=choiceOptions(t),label=taskLabel(t);
 $('#gameBody').innerHTML=gameHeader()+`<div class="task-mascot">${grownDragon(currentIsland.color,false)}<span>${r.solved?'Ein Lichtfunke wartet auf dich!':`Station ${r.idx+1}: ${currentIsland.dragon} begleitet dich. Du kannst jederzeit einen Tipp holen.`}</span></div>${question?`<p class="task-question">${question}</p>`:''}${taskVisual(t)}${t[3]==='story'||!label?'':`<div class="math" aria-label="${esc(label.replace('−','minus').replace('+','plus').replace('·','mal').replace(':','geteilt durch'))}">${esc(label)}</div>`}${currentLevel.range===10&&Array.isArray(t)&&!t[3]?beads(t):''}${answerInput(t,r)}<div class="feedback ${kind||(r.solved?'success':'')}" role="status" aria-live="polite">${message||(r.solved?r.guided?'Ihr habt die Aufgabe gemeinsam gelöst. Du kannst diesen Weg bei einer ähnlichen Aufgabe ausprobieren.':'Deine Antwort stimmt! Du kannst deine Reise fortsetzen.':'')}</div>${r.hint||r.guided?`<div class="helpbox"><h3>${r.guided?'Gemeinsam gelöst':'Ein möglicher Lernweg'}</h3><p>${r.guided?solvedText(t):hintText(t)}</p></div>`:''}<div class="game-actions"><button class="linkbtn" data-action="pause">Pause machen</button>${r.solved?'<button class="btn" data-action="next">'+(r.idx===runTotal(r)-1?'Trophäe entdecken ✦':'Lichtfunken sammeln →')+'</button>':`<div><button class="btn light" data-action="hint">${r.hint?'Tipp ist geöffnet':'Zeig mir einen Tipp'}</button>${r.attempts>=2?'<button class="linkbtn" data-action="guided">Gemeinsam lösen</button>':''}</div>`}</div>`;if(!r.solved&&!choice)setTimeout(()=>$('#answer,#answerHours,#answerEuros,#answerMeters')?.focus(),0);
}
function checkAnswer(value){const r=gameProgress().run;if(r.solved)return;const t=currentTask(r),options=choiceOptions(t),limit=taskLimit(t);if(!Number.isInteger(value)||value<0||value>limit||(options&&value>=options.length)){renderTask(options?'Wähle eine der Antworten.':`Bitte gib eine ganze Zahl zwischen 0 und ${limit} ein.`,'retry');return;}r.attempts++;if(value===taskAnswer(t)){r.solved=true;save();renderTask(r.attempts>1?'Du hast deine Antwort überprüft und verbessert. Sie stimmt!':'Deine Antwort stimmt. Dein nächster Lichtfunke wartet!','success');}else{r.hint=true;save();renderTask('Deine Antwort stimmt noch nicht. Probiere den Tipp aus und überprüfe deinen Weg.','retry');}}
function pauseGame(){$('#gameDialog').close();if(currentIsland)selected=currentIsland.id;navigate('island');}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='dracheninsel-spielstaende-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Deine Sicherung wurde zum Download bereitgestellt.');}
async function importBackup(file){if(!file)return;try{if(file.size>20000000)throw Error('Die Sicherung ist zu groß.');const candidate=validateState(JSON.parse(await file.text()));if(!window.confirm(`Diese Sicherung enthält ${candidate.profiles.length} Profile. Vorhandene Profile und Spielstände in diesem Browser ersetzen? Lade vorher bei Bedarf eine Sicherung herunter.`))return;state=candidate;storageOK=true;$('#storageNotice').hidden=true;save();render();toast(storageOK?'Sicherung geladen.':'Sicherung geladen, aber dauerhaftes Speichern ist nicht möglich.');}catch(e){toast('Sicherung nicht geladen: '+e.message);}finally{$('#backupInput').value='';}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;
 if(action==='home'||action==='trophies'||action==='growth'||action==='parents')navigate(action);
 else if(action==='select'){selected=id;render();}
 else if(action==='island'){selected=id;selectedPlace=ISLAND_LAYOUT[id][0].id;navigate('island');}
 else if(action==='profiles')openProfiles();
 else if(action==='close-profiles')$('#profileDialog').close();
 else if(action==='choose-profile'){state.active=id;save();$('#profileDialog').close();render();}
 else if(action==='delete-profile'){const p=state.profiles.find(p=>p.id===id);if(p&&window.confirm(`Profil „${p.name}“ und seine Spielstände auf diesem Gerät löschen?`)){state.profiles=state.profiles.filter(p=>p.id!==id);if(state.active===id)state.active=state.profiles[0]?.id||null;save();renderProfiles();render();}}
 else if(action==='play')startGame(id,Number(b.dataset.number)||1);
 else if(action==='place'){selectedPlace=id;renderIsland();$('#placeDetail').scrollIntoView?.({behavior:state.calm?'instant':'smooth',block:'nearest'});}
 else if(action==='place-map'){selected=id;selectedPlace=b.dataset.place;navigate('island');}
 else if(action==='hall-island'){hallIsland=id;renderTrophies();}
 else if(action==='level-map'){selected=id;selectedPlace=locationForLevel(id,Number(b.dataset.number)).id;navigate('island');}
 else if(action==='answer-choice')checkAnswer(Number(b.dataset.answer));
 else if(action==='begin')renderTask();
 else if(action==='pause')pauseGame();
 else if(action==='hint'){const r=gameProgress().run;if(r&&!r.solved){r.hint=true;save();renderTask('Ein Tipp ist ein Werkzeug für deinen Rechenweg.');}}
 else if(action==='guided'){const r=gameProgress().run;if(r&&!r.solved&&r.attempts>=2){r.hint=true;r.guided=true;r.solved=true;save();renderTask();}}
 else if(action==='next')nextTask();
 else if(action==='reflect')saveReflection(id);
 else if(action==='reward-repeat'){$('#gameDialog').close();startGame(currentIsland.id,currentLevel.number);}
 else if(action==='reward-growth'){$('#gameDialog').close();navigate('growth');}
 else if(action==='letter')openLetter(Number(b.dataset.number));
 else if(action==='close-letter')$('#letterDialog').close();
 else if(action==='post-page'){postPage=Number(b.dataset.number);renderGrowth();}
 else if(action==='reward-collection'){$('#gameDialog').close();hallIsland=currentIsland.id;navigate('trophies');}
 else if(action==='hop'){const g=b.querySelector('.float-dragon');g.classList.remove('hop');void g.getBoundingClientRect();g.classList.add('hop');setTimeout(()=>g.classList.remove('hop'),900);}
 else if(action==='export')exportBackup();
 else if(action==='import')$('#backupInput').click();
});

function landscape(i){const place=PLACES[i.id][0][0];return `<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="160" cy="149" rx="138" ry="22" fill="#83b5a040"/><path d="M23 123Q10 91 67 81Q83 48 143 57Q207 31 254 71Q304 79 301 116Q282 156 168 155Q52 158 23 123Z" fill="#ead9aa"/><path d="M26 112Q24 88 80 75Q101 49 150 65Q202 44 249 82Q293 82 296 108Q279 141 165 142Q57 143 26 112Z" fill="${i.color}"/><path d="M73 118Q117 134 164 113T249 99" stroke="#fff0b5" stroke-width="2" stroke-dasharray="2 9" fill="none"/><svg x="89" y="-1" width="145" height="142" viewBox="0 0 160 140">${landmark(place).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg><path d="M48 99l3-7 3 7-3 7ZM257 125l3-7 3 7-3 7Z" fill="#fff0b6"/></svg>`;}
function gameHeader(){const r=gameProgress().run,count=(r?.idx||0)+Number(r?.solved||false),total=runTotal(r);return `<button class="icon-btn close" data-action="pause" aria-label="Pausieren und zur Insel zurückkehren">×</button><div class="game-top"><span>${currentIsland.name} · Drachenmission ${currentLevel.label}</span><span>${count} / ${total} Lichtfunken</span></div>${sparkRow(count,false,r?.solved?r.idx:-1,total)}`;}

function allLevels(){return ISLANDS.flatMap(i=>[...islandLevels(i.id),...(savedBonus(i.id)?[savedBonus(i.id)]:[])]);}
function completedLevels(){return allLevels().filter(l=>progress(l.islandId,l.number).completed);}
function islandCompleted(id){const levels=islandLevels(id).filter(l=>l.available);return levels.length>0&&levels.every(l=>progress(id,l.number).completed);}
function progress(id,number=1){return profile()?.progress[levelKey(id,number)]||{completed:false,history:[],run:null};}
function ensureProgress(id,number=1){const p=profile();if(!p)return null;const key=levelKey(id,number);return p.progress[key]||(p.progress[key]={completed:false,history:[],run:null,rounds:0,best:null,sparks:0});}
function gameProgress(){return ensureProgress(currentIsland.id,currentLevel.number);}
function startGame(id,number=1){const level=getLevel(id,number);if(!level.available){toast('Die Lerninhalte für dieses Level kommen später.');return;}if(!profile()){selected=id;openProfiles();toast('Wähle zuerst einen Spitznamen.');return;}currentIsland=ISLANDS.find(i=>i.id===id);currentLevel=level;selectedPlace=level.location.id;const pr=gameProgress();if(!pr.run){pr.run=newRun();save();renderGameStory();}else renderTask();if(!$('#gameDialog').open)$('#gameDialog').showModal();}
function hintText(t){if(!Array.isArray(t)){if(!['parity','bond','neighbor'].includes(t.type))return extraTaskHint(t);if(t.type==='parity')return 'Lege die Menge mit Punkten oder Plättchen nach und bilde immer Zweierpaare. Bleibt eines allein, ist die Zahl ungerade. Ohne Rest ist sie gerade. Du kannst auch die letzte Ziffer betrachten.';if(t.type==='neighbor')return t.direction==='previous'?'Suche die Zahl auf einer Zahlenspur. Gehe genau einen Schritt zurück. Welche Zahl steht direkt davor?':'Suche die Zahl auf einer Zahlenspur. Gehe genau einen Schritt weiter. Welche Zahl steht direkt danach?';return `Lege ${t.number} Plättchen in ein Zehnerfeld. Wie viele Plätze sind noch frei? Ergänze die leeren Plätze oder rechne ${t.total} − ${t.number} = ?.`;}if(typeof t[5]==='string')return esc(t[5]);if(t[2]==='·')return 'Lege gleich große Gruppen oder ein Punktefeld. Du kannst eine bekannte Kernaufgabe nutzen und eine Gruppe ergänzen oder wegnehmen. Rechne die Teilergebnisse selbst aus.';if(t[2]===':')return `Nutze die Umkehraufgabe: ${t[1]} · ? = ${t[0]}. Oder verteile die Menge in gleich große Gruppen und zähle selbst, wie viele Gruppen entstehen.`;const a=t[0],b=t[1],result=taskResult(t);if(t[3]==='missing')return t[2]==='+'?`Nutze die Umkehraufgabe: ${result} − ${a} = ?. Ziehe zuerst Hunderter, dann Zehner und Einer ab. Rechne die Zwischenergebnisse selbst aus.`:`Nutze die Umkehraufgabe: ${a} − ${result} = ?. Oder ergänze von ${result} bis ${a}. Wie groß ist der Unterschied?`;if(currentLevel.range===10)return t[2]==='+'?`Starte mit ${a} Punkten. Lege ${b} dazu. Zähle selbst, wie viele es zusammen sind.`:`Starte mit ${a} Punkten und nimm ${b} weg. Zähle selbst, wie viele bleiben.`;if(currentLevel.range<=30){const crosses=Math.floor(a/10)!==Math.floor(result/10)&&a%10!==0;const path=t[2]==='+'?crosses?`Starte bei ${a} und ergänze ${b}. Du kannst zuerst bis zum nächsten Zehner gehen. Zerlege dafür die zweite Zahl und rechne den Rest danach weiter.`:`Starte bei ${a} und ergänze ${b} schrittweise. Rechne ganze Zehner und Einer nacheinander oder gehe auf einer Zahlenspur vorwärts.`:crosses?`Starte bei ${a} und ziehe ${b} ab. Du kannst die zweite Zahl zerlegen und beim Zurückgehen am Zehner Halt machen.`:`Starte bei ${a} und ziehe ${b} ab. Rechne ganze Zehner und Einer nacheinander oder gehe auf einer Zahlenspur rückwärts.`;return (t[3]==='story'?'Lege die Geschichte mit Punkten nach. ':'')+path+' Berechne die Zwischenergebnisse selbst. Ein anderer Rechenweg ist auch erlaubt.';}const parts=[Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(Boolean);const stages=parts.map((part,n)=>`${n?'dein Zwischenergebnis':a} ${t[2]} ${part} = ?`);return `Zerlege ${b} in ${parts.join(' + ')}. ${stages.join(' → ')}. Rechne jedes Zwischenergebnis selbst aus. Du darfst auch einen anderen Weg wählen.`;}
function trophyArt(level,island,animated=true){if(level.trophy.type==='dragon')return dragon(island.color,animated);const shapes={crystal:landmark('crystal').replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,''),lantern:'<path d="M80 19v18" stroke="#9b855d" stroke-width="5"/><path d="M62 43q-2-27 18-27t18 27" fill="none" stroke="#b49355" stroke-width="5"/><path d="M54 44h52l-8 70H62Z" fill="#f7d589" stroke="#b49355" stroke-width="4"/><path d="M66 47h28v53H66Z" fill="#fff4c2"/><path d="M80 68q14 15 0 26q-13-9 0-26" fill="#eeaf58"/><path d="M53 41h54m-48 78h42" stroke="#8b7959" stroke-width="7" stroke-linecap="round"/>',egg:'<ellipse cx="80" cy="120" rx="41" ry="8" fill="#61775622"/><path d="M40 91q0-70 40-70t40 70q0 32-40 32T40 91" fill="#d7c3ea" stroke="#af96c9" stroke-width="3"/><path d="M45 76l19 10 13-13 15 12 22-8" fill="none" stroke="#b29ac9" stroke-width="3"/><circle cx="63" cy="51" r="6" fill="#f6e5b1"/><circle cx="99" cy="61" r="5" fill="#f6e5b1"/><circle cx="74" cy="103" r="5" fill="#f6e5b1"/>',medal:'<path d="M51 18h27l18 41-25 14Z" fill="#83b3a1"/><path d="M83 18h27L94 74 70 61Z" fill="#609b8a"/><circle cx="80" cy="86" r="36" fill="#edc56e" stroke="#c69d4d" stroke-width="4"/><circle cx="80" cy="86" r="26" fill="#f7de96" stroke="#d4b46b" stroke-width="2"/><path d="M80 64l6 14 15 3-11 11 2 15-12-7-13 7 3-16-12-10 16-3Z" fill="#c89a47"/>'};return `<svg viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="${animated?'float-dragon':''}">${shapes[level.trophy.type]}</g></svg>`;}
function renderParents(){const p=profile(),levels=installedLevels();const rows=levels.map(l=>({l,i:ISLANDS.find(x=>x.id===l.islandId),pr:progress(l.islandId,l.number)}));const all=rows.flatMap(x=>x.pr.history),last=all.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">Lernen begleiten</div><h1>Kleine Schritte sichtbar machen.</h1><p>Hier sehen Sie die Fortschritte von ${p?esc(p.name):'Ihrem Kind'}. Die Übersicht gehört ausschließlich zu diesem Browser.</p></div><button class="btn secondary" data-action="profiles">Kind wechseln</button></section><div class="parent-grid"><section class="panel"><h3>${p?'Lernreise von '+esc(p.name):'Noch kein Kinderprofil'}</h3><div class="stats"><div class="stat"><strong>${completedLevels().length}/${levels.length}</strong><span>Verfügbare Drachenmissionen geschafft</span></div><div class="stat"><strong>${totalRounds()}</strong><span>Runden abgeschlossen</span></div><div class="stat"><strong>${last?firstTry(last.records)+'/'+last.records.length:'–'}</strong><span>Zuletzt im ersten Versuch ohne Hilfe</span></div></div><p class="small muted">Die Lernabenteuer sind nach Inselorten und Drachenmissionen gegliedert. Die konkreten Lerninhalte werden einzeln ergänzt. Wiederholte Aufgaben allein belegen noch keine sichere Beherrschung.</p></section><section class="panel"><h3>Spielstände aufbewahren</h3><p class="small muted">Spielstände liegen auf diesem Gerät in diesem Browser und werden nicht automatisch übertragen. Wer denselben Browser verwendet, kann diese Profile sehen.</p><div class="tools"><button class="btn" data-action="export">Sicherung herunterladen</button><button class="btn light" data-action="import">Sicherung laden</button></div><p class="small muted" style="margin-top:16px">Beim Laden werden die vorhandenen Profile nach Bestätigung ersetzt. Alte Sicherungen bleiben kompatibel. Enthält eine Sicherung neuere Level, muss zuerst die passende Websiteversion geöffnet werden.</p></section></div><section class="panel" style="margin-top:22px"><h3 style="margin-bottom:15px">Fortschritt pro Drachenmission</h3><div class="table-wrap"><table><thead><tr><th>Insel & Mission</th><th>Stand</th><th>Beste Übungsrunde</th><th>Erster Versuch ohne Hilfe</th><th>Mit Tipp / weiterem Versuch</th><th>Gemeinsam gelöst</th></tr></thead><tbody>${rows.map(({l,i,pr})=>{const h=pr.history.at(-1),r=pr.run?.records||h?.records;return `<tr><td><strong>${i.name} · Drachenmission ${getLevel(i.id,l.number).label}</strong><br><span class="muted">${esc(l.learningGoal||l.title)}</span></td><td>${pr.run?'In Arbeit: '+pr.run.idx+'/'+runTotal(pr.run):h?'Abgeschlossen':'Noch nicht besucht'}</td><td>${bestSummary(i.id,l.number)||'Noch keine Runde'}</td><td>${r?firstTry(r):'–'}</td><td>${r?r.filter(x=>!x.guided&&(x.hint||x.attempts>1)).length:'–'}</td><td>${r?r.filter(x=>x.guided).length:'–'}</td></tr>`;}).join('')}</tbody></table></div><p class="small muted" style="margin-top:15px">Die beste Runde bleibt dauerhaft erhalten: zuerst zählt der Anteil selbst gelöster Aufgaben, dann der Anteil der Treffer im ersten Versuch. Strategie-Tipps sind erlaubt. Die übrigen Spalten zeigen die laufende oder letzte Runde. Funken und Wachstum beschreiben Übung, keine feste Begabung oder sichere Beherrschung.</p></section><section class="panel" style="margin-top:22px"><h3>Ein Blick auf den Lernweg</h3><p class="small muted" style="margin-top:12px">${last?.reflection?esc(REFLECTION_CHOICES[last.reflection]):'Nach einem Abenteuer kann Ihr Kind freiwillig erzählen, welche Strategie oder Hilfe nützlich war.'}</p><p class="small muted" style="margin-top:10px">Keine Geschwindigkeitswertung, keine Rangliste und keine Extra-Funken für perfekte Durchgänge. Auch nach 200 gespeicherten Runden bleiben Gesamtfunken, Übungszähler und bester Durchgang erhalten.</p></section><div class="hall-note">🌱 Fragen Sie nach dem Rechenweg: „Wie bist du auf dein Ergebnis gekommen?“ Üben Sie danach ähnliche Aufgaben mit neuen Zahlen. Hilfe und Pausen sind Teil des Lernens.</div>`;}

function getLevel(id,number=1){const existing=LEVEL_CONTENT.get(levelKey(id,number));if(existing)return decorateLevel(existing);return decorateLevel({islandId:id,number,key:levelKey(id,number),available:false,title:'Dein nächstes Abenteuer',trophy:{type:['dragon','crystal','lantern','egg','medal'][(number-1)%5],name:'Trophäe für Drachenmission '+number}});}
function islandLevels(id){return ISLAND_LAYOUT[id].flatMap(p=>p.levels.map(n=>getLevel(id,n)));}
function placeProgress(id,place){const levels=place.levels.map(n=>getLevel(id,n));return {total:levels.length,completed:levels.filter(l=>progress(id,l.number).completed).length,available:levels.filter(l=>l.available).length};}
function flightRoute(i){const points=ISLAND_LAYOUT[i.id].map(p=>[p.position[0]*8,p.position[1]*5.3-17]);let path=`M${points[0][0]} ${points[0][1]}`;const sparks=[];for(let n=1;n<points.length;n++){const [x,y]=points[n-1],[a,b]=points[n],c=x+(a-x)*.6,d=b+(y-b)*.4;path+=`C${c} ${y} ${a} ${d} ${a} ${b}`;sparks.push([x*.125+c*.375+a*.5,y*.5+d*.375+b*.125]);}return {path,sparks};}
function bonusPanel(id,hall=false){const l=savedBonus(id);if(!l)return '';const pr=progress(id,l.number),i=ISLANDS.find(x=>x.id===id);return `<section class="panel saved-bonus"><span class="eyebrow">Dein bisheriges Abenteuer</span><h3>${esc(l.title)}</h3><p class="small muted">Bonusmission bis ${l.range} · Dein gespeicherter Lernweg und deine Trophäe bleiben erhalten.</p>${hall&&pr.completed?`<div class="bonus-art">${trophyArt(l,i)}</div><strong>${esc(l.trophy.name)}</strong>`:''}${bestSummary(id,l.number)}<button class="btn light" data-action="play" data-id="${id}" data-number="${l.number}">${pr.run?'Gespeicherte Reise fortsetzen':'Bonusmission noch einmal üben'} →</button></section>`;}
function renderIsland(){const i=ISLANDS.find(x=>x.id===selected),places=ISLAND_LAYOUT[i.id],place=places.find(p=>p.id===selectedPlace)||places[0];selectedPlace=place.id;const placeIndex=places.indexOf(place)+1,levels=place.levels.map(n=>getLevel(i.id,n)),total=islandLevels(i.id).length;$('#app').innerHTML=`<div class="back-row"><button class="linkbtn" data-action="home">← Zur Weltkarte</button><span class="pill">${i.grade} · ${places.length} Orte · ${total} Drachenmissionen</span></div><section class="hero"><div><div class="eyebrow">${i.dragon}s Inselabenteuer</div><h1>${i.name}</h1><p>${places.length} besondere Orte warten auf euch. Wähle einen Ort und entdecke seine kleinen Abenteuer – jedes mit einer eigenen Trophäe.</p></div></section><div class="layout"><section class="island-map" aria-label="Inselkarte mit ${places.length} unterschiedlichen Orten">${islandTerrain(i)}${places.map((p,n)=>{const stats=placeProgress(i.id,p);return `<button class="level-node ${stats.available?'available':'locked'} ${p.id===place.id?'selected-place':''}" style="left:${p.position[0]}%;top:${p.position[1]}%" data-action="place" data-id="${p.id}" aria-pressed="${p.id===place.id}" aria-controls="placeDetail" aria-label="Abenteuerort ${n+1}: ${esc(p.name)}, ${stats.completed} von ${stats.total} Drachenmissionen geschafft"><span class="landmark-art">${landmark(p.landmark)}<span class="level-badge" aria-hidden="true">${stats.completed===stats.total?'✓':n+1}</span></span><span class="label"><strong>${esc(p.name)}</strong><small>${stats.completed}/${stats.total} geschafft · ${stats.available?'Abenteuer entdecken':'Inhalte folgen'}</small><span class="place-beads" aria-hidden="true">${p.levels.map(number=>`<i class="${progress(i.id,number).completed?'earned':''}"></i>`).join('')}</span></span></button>`;}).join('')}<span class="map-caption">✦ ${places.length} Orte · viele kleine Abenteuer</span></section><aside class="side"><section class="panel place-detail" id="placeDetail" aria-label="Drachenmissionen am gewählten Inselort"><span class="eyebrow">Abenteuerort ${placeIndex}</span><h2>${esc(place.name)}</h2><p class="muted small">${place.levels.length} Drachenmissionen an diesem Ort. Du bestimmst dein Tempo.</p><div class="sublevel-list">${levels.map(l=>{const pr=progress(i.id,l.number);return `<button class="sublevel-card ${pr.completed?'completed':''}" ${l.available?`data-action="play" data-id="${i.id}" data-number="${l.number}"`:'disabled'}><span class="sublevel-number">${pr.completed?'✓':l.label}</span><span><strong>${l.available?esc(l.title):'Drachenmission '+l.label}</strong><small>${l.available?pr.run?'Weiterreisen · '+pr.run.idx+'/'+runTotal(pr.run)+' Funken':pr.completed?'Geschafft · Noch einmal spielen':'5 Aufgaben · Bereit zum Start':'Lerninhalt und Geschichte folgen'}</small>${l.available?`<small class="sublevel-prize">✦ ${esc(l.trophy.name)}</small>${bestSummary(i.id,l.number)}`:''}</span>${l.available?'<span class="sublevel-arrow" aria-hidden="true">→</span>':''}</button>`;}).join('')}</div><p class="small muted">Deine Preise werden für jede Drachenmission einzeln gesammelt.</p></section><div class="gentle-note"><span aria-hidden="true">✦</span><div><b>Ein Ort, ${place.levels.length} Lernabenteuer.</b>Wähle einen der ${places.length} Orte auf der Inselkarte. Auch zukünftige Orte kannst du dir schon ansehen.</div></div></aside></div>${bonusPanel(i.id)}`;}

function independentCount(records){return records.filter(r=>!r.guided).length;}
function firstCorrectCount(records){return records.filter(r=>!r.guided&&r.attempts===1).length;}
function compareRounds(a,b){return independentCount(a.records)*b.records.length-independentCount(b.records)*a.records.length||firstCorrectCount(a.records)*b.records.length-firstCorrectCount(b.records)*a.records.length;}
function copyRound(h){return {date:h.date,records:h.records.map(r=>({...r})),...(h.reflection?{reflection:h.reflection}:{})};}
function chooseBest(rounds,prior=null){let best=prior?copyRound(prior):null;for(const h of rounds)if(!best||compareRounds(h,best)>0)best=copyRound(h);return best;}
function cleanRound(h,level){if(!h||!validDate(h.date))throw Error('Abenteuerdatum ungültig.');const records=cleanRecords(h.records,level);if(![5,10].includes(records.length))throw Error('Abenteuerdaten ungültig.');if(h.reflection!==undefined&&!Object.hasOwn(REFLECTION_CHOICES,h.reflection))throw Error('Lernrückblick ungültig.');return {date:h.date,records,...(h.reflection?{reflection:h.reflection}:{})};}
function knownSparks(progress){return Object.values(progress).reduce((sum,pr)=>sum+progressSparks(pr),0);}
function progressSparks(pr){return pr.sparks??(pr.rounds??pr.history.length)*10+(pr.run?.records.length||0);}
function ensureLearning(p=profile()){if(!p)return {sparks:0,readLetters:[]};if(!p.learning)p.learning={sparks:knownSparks(p.progress),readLetters:[]};return p.learning;}
function pendingSparks(p=profile()){return p?Object.values(p.progress).filter(pr=>pr.run?.solved).length:0;}
function sparkTotal(p=profile()){return ensureLearning(p).sparks+pendingSparks(p);}
function totalRounds(p=profile()){return p?Object.values(p.progress).reduce((sum,pr)=>sum+(pr.rounds??pr.history.length),0):0;}
function growthStage(p=profile()){const count=sparkTotal(p);let index=0;for(let n=0;n<GROWTH_STAGES.length;n++)if(count>=GROWTH_STAGES[n].at)index=n;return {...GROWTH_STAGES[index],index,next:GROWTH_STAGES[index+1]||null,count};}
function grownDragon(color,animated=true){const g=growthStage();return `<div class="growing-dragon" style="--dragon-scale:${g.scale}" aria-label="Dein Drache wächst mit deiner Übungsreise">${dragon(color,animated)}</div>`;}
function bigFlame(count){return `<div class="growing-fire" style="--fire-size:${70+Math.min(80,Math.sqrt(count)*2.5)}px" role="img" aria-label="Gesammelte Gesamtflamme mit ${count} Lichtfunken"><svg viewBox="0 0 40 48" aria-hidden="true"><path d="M20 3C23 13 33 14 33 27C33 37 27 43 20 43S7 37 7 28C7 21 12 17 13 11C14 17 17 18 18 20C23 14 22 9 20 3Z" fill="#edb14d" stroke="#d39b38" stroke-width="1"/><path d="M20 23C22 28 27 29 26 35C25 42 14 42 14 35C14 31 18 30 20 23Z" fill="#fff3b1"/></svg></div>`;}
function bestSummary(id,number){const pr=progress(id,number),best=pr.best||chooseBest(pr.history);return best?`<span class="best-summary"><strong>Beste Runde: ${independentCount(best.records)}/${best.records.length} selbst gelöst</strong><small>Tipps erlaubt · ${firstCorrectCount(best.records)}/${best.records.length} im ersten Versuch</small></span>`:'';}
function saveReflection(key){if(!Object.hasOwn(REFLECTION_CHOICES,key)||!currentIsland||!currentLevel)return;const pr=gameProgress(),last=pr.history.at(-1);if(!last)return;last.reflection=key;if(pr.best?.date===last.date)pr.best.reflection=key;save();renderReward();toast('Dein Lernrückblick ist gespeichert.');}
function nextTask(){const pr=gameProgress(),r=pr.run;if(!r?.solved)return;const learning=ensureLearning(),committed=progressSparks(pr);r.records.push({task:runOffset(r)+r.idx,answer:taskAnswer(currentTask(r)),attempts:r.attempts,hint:r.hint,guided:r.guided});r.idx++;learning.sparks++;pr.sparks=committed+1;const milestone=learning.sparks%100===0?learning.sparks:null;if(r.idx===runTotal(r)){const round={date:new Date().toISOString(),records:r.records};pr.best=chooseBest([round],pr.best||chooseBest(pr.history));pr.rounds=(pr.rounds??pr.history.length)+1;pr.history.push(round);pr.history=pr.history.slice(-200);pr.completed=true;pr.run=null;save();renderReward();render();}else{r.attempts=0;r.hint=false;r.solved=false;r.guided=false;save();renderTask();}if(milestone)toast(`${milestone} Lichtfunken! Ein neuer Dankeschön-Brief wartet in deiner Lernreise.`);}
function renderReward(){const pr=gameProgress(),reflection=pr.history.at(-1)?.reflection;$('#gameBody').innerHTML=`<button class="icon-btn close" data-action="pause" aria-label="Zur Insel zurückkehren">×</button><div class="story"><div class="eyebrow">Drachenmission ${currentLevel.label} ist geschafft</div><div class="reward-stage">${trophyArt(currentLevel,currentIsland)}</div><h2>${esc(currentLevel.trophy.name)} freigespielt!</h2><p>${esc(currentLevel.after||currentIsland.dragon+' freut sich mit dir über eure Lernreise.')}</p><span class="pill">${pr.history.at(-1).records.length} Stationen bearbeitet · Jeder Lernweg zählt</span><div class="reflection-box"><h3>Was hat dir beim Rechnen geholfen?</h3><p class="small muted">Du kannst es erzählen oder direkt weiterreisen.</p><div class="reflection-options">${Object.entries(REFLECTION_CHOICES).map(([key,label])=>`<button class="${reflection===key?'chosen':''}" data-action="reflect" data-id="${key}" aria-pressed="${reflection===key}">${label}</button>`).join('')}</div></div><div class="reward-actions"><button class="btn" data-action="reward-collection">Meine Trophäe besuchen →</button><button class="btn light" data-action="reward-repeat">Noch einmal üben</button><button class="linkbtn" data-action="reward-growth">Meine Lernreise</button></div><p class="small">Dein Drache freut sich auch dann auf dich, wenn eine Aufgabe noch schwierig ist.</p></div>`;}
function learningBanner(){const g=growthStage();return `<section class="learning-banner" aria-label="Deine wachsende Lernreise"><div class="banner-flame">${bigFlame(g.count)}</div><div><strong>${g.count} Lichtfunken · ${g.name}</strong><p>${g.message} Auch Wiederholungen und Rechnen mit Hilfe lassen dein Abenteuer wachsen.</p></div><button class="btn light" data-action="growth">Meine Lernreise →</button></section>`;}
function renderGrowth(){const p=profile(),g=growthStage(),companion=ISLANDS.find(i=>i.id===hallIsland)||ISLANDS[1],learn=ensureLearning(p),milestones=Math.floor(g.count/100),unread=milestones-learn.readLetters.length,pages=Math.max(1,Math.ceil(milestones/6));postPage=Math.max(0,Math.min(postPage,pages-1));const letters=Array.from({length:Math.max(0,Math.min(6,milestones-postPage*6))},(_,n)=>100*(milestones-postPage*6-n));$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">${p?esc(p.name)+'s':'Deine'} Lernreise</div><h1>Mit jedem Lernschritt wachsen wir.</h1><p>Dein Drache bekommt größere Flügel und dein Feuer leuchtet stärker. Wiederholen, Tipps und Pausen gehören zu deiner Reise.</p></div></section><div class="growth-panels"><section class="panel growth-companion"><span class="pill">${g.name}</span><div class="growth-dragon-stage">${grownDragon(companion.color)}</div><h2>${companion.dragon} wächst mit dir.</h2><p class="muted small">${g.message} Dein Drache verliert bei Fehlern und Pausen keine Größe.</p><div class="growth-stages" aria-label="Wachstumsstufen">${GROWTH_STAGES.map((stage,n)=>`<span class="${n<=g.index?'reached':''}"><i aria-hidden="true">${n<g.index?'✓':n===g.index?'✦':'·'}</i><small>${stage.at===0?'Start':stage.at+' Funken'}</small></span>`).join('')}</div><p class="small muted">${g.next?'Noch '+(g.next.at-g.count)+' Funken bis zu „'+g.next.name+'“. Es gibt keine Eile.':'Dein Drache ist groß geworden. Eure Lernreise geht weiter.'}</p></section><section class="panel flame-overview"><div class="eyebrow">Dein gesammeltes Drachenfeuer</div>${bigFlame(g.count)}<strong class="fire-total">${g.count}</strong><p class="muted small">Lichtfunken aus ${totalRounds(p)} abgeschlossenen Runden und deinen laufenden Abenteuern.</p><div class="gentle-note"><span aria-hidden="true">🌱</span><div><b>Deine Lernreise zählt.</b>Jede bearbeitete Station gibt einen Funken. Fehler, Tipps und gemeinsames Lösen kosten keine Funken.</div></div></section></div><section class="panel mindset-panel"><h2>Unsere Drachenvereinbarung</h2><div class="mindset-promises"><div><strong>Ich darf etwas noch nicht können.</strong><p>Eine schwierige Aufgabe zeigt mir, was ich als Nächstes üben kann.</p></div><div><strong>Ich darf meinen Weg ändern.</strong><p>Punkte zählen, Zahlen zerlegen, eine Umkehraufgabe oder einen Tipp nutzen.</p></div><div><strong>Ich darf Hilfe und Pausen brauchen.</strong><p>Danach kann ich mit einem passenden Rechenweg weiterlernen.</p></div></div></section><section class="dragon-post"><div class="collection-heading"><div><div class="eyebrow">Post von deinen Insel-Drachen</div><h2>Ein Dankeschön für je 100 Funken</h2><p class="muted small">${unread>0?unread+' ungelesene Briefe warten auf dich.':'Alle freigespielten Briefe kannst du jederzeit erneut lesen.'} Deine Funken werden dafür nicht ausgegeben.</p></div></div>${letters.length?`<div class="letter-grid">${letters.map(at=>`<button class="letter-card ${learn.readLetters.includes(at)?'read':'unread'}" data-action="letter" data-number="${at}"><span class="envelope" aria-hidden="true">✉</span><span><strong>Dein Brief zu ${at} Funken</strong><small>${learn.readLetters.includes(at)?'Schon gelesen · Erneut öffnen':'Neu · Dankeschön öffnen'}</small></span></button>`).join('')}</div>${pages>1?`<div class="post-pagination"><button class="btn light" data-action="post-page" data-number="${postPage-1}" ${postPage===0?'disabled':''}>Neuere Briefe</button><span class="small muted">${postPage+1} / ${pages}</span><button class="btn light" data-action="post-page" data-number="${postPage+1}" ${postPage>=pages-1?'disabled':''}>Ältere Briefe</button></div>`:''}`:`<div class="empty-post"><span aria-hidden="true">✉</span><p>Bei 100 Funken kommt dein erster Brief. Du kannst deine Abenteuer so oft üben, wie du möchtest.</p></div>`}</section><section class="panel personal-best-panel"><h2>Deine besten Übungsrunden</h2><p class="small muted">Verglichen werden nur deine eigenen Runden: zuerst der Anteil selbst gelöster Aufgaben, dann der Anteil der Treffer im ersten Versuch. Strategie-Tipps sind erlaubt und verschlechtern die Wertung nicht. Jede Aufgabe schenkt einen Funken; eine neue Runde hat fünf Aufgaben. Ältere Runden bleiben erhalten.</p><div class="best-level-list">${installedLevels().map(l=>{const level=getLevel(l.islandId,l.number),i=ISLANDS.find(x=>x.id===l.islandId),pr=progress(l.islandId,l.number);return `<div class="best-level-row"><div><strong>${i.name} · ${level.label}</strong><p class="small muted">${esc(level.title)} · ${pr.rounds??pr.history.length} Übungsrunden</p>${bestSummary(i.id,l.number)||'<p class="small muted">Deine erste Runde wartet noch auf dich.</p>'}</div><button class="btn secondary" data-action="play" data-id="${i.id}" data-number="${l.number}">${pr.completed?'Noch einmal üben':'Entdecken'}</button></div>`;}).join('')}</div><p class="small muted">Wiederholte Aufgaben werden vertrauter. Die beste Runde ist eine Erinnerung an deine Übung, kein Nachweis, dass du ein Thema schon in jeder Situation beherrschst.</p></section>`;}

 return `<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(i.dragon+' '+theme.alt)}" data-letter-scene="${theme.scene}"><rect width="480" height="250" rx="24" fill="#f0f1df"/><circle cx="400" cy="49" r="24" fill="#f3d985"/><path d="M0 178Q83 133 186 176T480 159V250H0z" fill="#d3e1bf"/><path d="M0 210Q149 177 271 209T480 191V250H0z" fill="#bdd1a4"/><path d="M48 49q15-14 30 0t30 0m143 7q15-14 30 0t30 0" stroke="#fff9e6" stroke-width="9" fill="none" stroke-linecap="round"/><svg x="48" y="40" width="214" height="214" viewBox="0 0 200 200">${dragon(i.color,true).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>${scenes[theme.scene]}${star(38,125,7)}</svg>`;
}
function openLetter(at){if(!profile()||!Number.isInteger(at)||at<100||at%100||at>sparkTotal())return;const learn=ensureLearning();if(!learn.readLetters.includes(at)){learn.readLetters.push(at);save();}const i=ISLANDS[(at/100-1)%ISLANDS.length],theme=LETTER_THEMES[(at/100-1)%LETTER_THEMES.length];$('#letterBody').innerHTML=`<button class="icon-btn close" data-action="close-letter" aria-label="Brief schließen">×</button><div class="letter-content"><span class="pill">Drachenpost · ${at} Funken</span><div class="letter-illustration">${letterIllustration(i,theme)}</div><h2>${theme.title}</h2><p>Hallo ${esc(profile().name)},</p><p>${at} gesammelte Lichtfunken erzählen von deiner Übungsreise. Danke, dass du mit uns die Dracheninseln erkundest!</p><p>${theme.body}</p><blockquote class="encouragement"><span class="encouragement-label">Dein Mutmach-Spruch</span>„${theme.motto}“</blockquote><p class="signature">Dein ${i.dragon} aus ${i.name}</p><button class="btn" data-action="close-letter">Brief aufbewahren ✓</button></div>`;if(!$('#letterDialog').open)$('#letterDialog').showModal();if(view==='growth')renderGrowth();}

$('#brandDragon').innerHTML=dragon();render();
</script>
